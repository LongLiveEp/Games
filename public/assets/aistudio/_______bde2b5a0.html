    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-color: #0e1017;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

      -webkit-tap-highlight-color: transparent;

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 0 !important;
      padding: 0 !important;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
      touch-action: none;
    }
    .orientation-prompt {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(14, 16, 23, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .orientation-box {
      background: #1d1e2c;
      border: 2px solid #ffd166;
      border-radius: 16px;
      padding: 26px 20px;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .phone-rotate-icon {
      position: relative;
      margin-bottom: 14px;
      animation: rotatePhoneAnim 2.2s infinite ease-in-out;
    }
    .rotate-arrow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #ffd166;
      font-weight: bold;
    }
    @keyframes rotatePhoneAnim {
      0%, 15% { transform: rotate(0deg); }
      45%, 65% { transform: rotate(-90deg); }
      90%, 100% { transform: rotate(0deg); }
    }
    .orientation-box h2 {
      font-family: 'Cormorant Infant', Georgia, serif;
      font-size: 24px;
      font-weight: bold;
      color: #ffd166;
      margin-bottom: 10px;
    }
    .orientation-box p {
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.45;
      margin-bottom: 18px;
    }
    .orientation-box button {
      background: #2b2d42;
      border: 1px solid #8d99ae;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    .orientation-box button:active {
      background: #3d405b;
      transform: scale(0.97);
    }

    function toggleAppFullscreen() {
      try {
        let targetDoc = window.document;
        try {
          if (window.parent && window.parent !== window && window.parent.document) {
            targetDoc = window.parent.document;
          }
        } catch (err) {
          targetDoc = window.document;
        }

        const docEl = targetDoc.documentElement;
        const isFs = targetDoc.fullscreenElement || targetDoc.webkitFullscreenElement || targetDoc.mozFullScreenElement || targetDoc.msFullscreenElement ||
                     document.fullscreenElement || document.webkitFullscreenElement;

        if (!isFs) {
          const rfs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
          if (rfs) {
            Promise.resolve(rfs.call(docEl)).then(() => {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
              }
            }).catch(() => {
              const fallbackEl = document.documentElement;
              const fallbackRfs = fallbackEl.requestFullscreen || fallbackEl.webkitRequestFullscreen;
              if (fallbackRfs) fallbackRfs.call(fallbackEl).catch(() => {});
            });
          }
        } else {
          const efs = targetDoc.exitFullscreen || targetDoc.webkitExitFullscreen || targetDoc.mozCancelFullScreen || targetDoc.msExitFullscreen ||
                      document.exitFullscreen || document.webkitExitFullscreen;
          if (efs) {
            Promise.resolve(efs.call(targetDoc)).catch(() => {});
          }
        }
      } catch (e) {
        // Safe fallback in restricted frames
      }
    }

    /**
     * ============================================================================
     * 4. PROCEDURAL WEBAUDIO SOUND MANAGER
     * ============================================================================
     */
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      playTone(freqStart, freqEnd, duration, type = 'sine', gainVal = 0.15) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freqStart, now);
          if (freqEnd !== freqStart) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
          }
          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {
          // Ignore audio context errors on restricted autoplay
        }
      }

      jump(isDouble = false) {
        if (isDouble) {
          this.playTone(280, 620, 0.14, 'triangle', 0.16);
        } else {
          this.playTone(190, 440, 0.13, 'sine', 0.16);
        }
      }

      roll() {
        this.playTone(160, 75, 0.15, 'triangle', 0.14);
      }

      swing(comboStep = 1, isSaber = false) {
        if (isSaber) {
          // Crisp Damascus steel saber whistle-cut
          const base = 360 + comboStep * 95;
          this.playTone(base, base * 0.38, 0.09, 'sawtooth', 0.12);
          setTimeout(() => this.playTone(base * 1.4, base * 0.7, 0.06, 'sine', 0.08), 18);
        } else {
          const base = 180 + comboStep * 55;
          this.playTone(base, base * 0.45, 0.1, 'sawtooth', 0.11);
        }
      }

      panHit(isHeavy = false) {
        // Metallic frying pan / saber impact!
        if (isHeavy) {
          this.playTone(520, 140, 0.22, 'square', 0.2);
          setTimeout(() => this.playTone(780, 290, 0.18, 'triangle', 0.16), 25);
        } else {
          this.playTone(420, 160, 0.12, 'square', 0.16);
        }
      }

      shieldBlock() {
        // Heavy oak & iron shield deflection thud + ring
        this.playTone(150, 70, 0.14, 'square', 0.2);
        setTimeout(() => this.playTone(680, 420, 0.1, 'triangle', 0.14), 20);
      }

      nyavkaWail() {
        // Eerie forest spirit harmonic shriek
        this.playTone(580, 920, 0.18, 'sine', 0.12);
        setTimeout(() => this.playTone(880, 520, 0.22, 'triangle', 0.1), 90);
      }

      lisovykRoar() {
        // Deep resonant ancient forest roar
        [140, 115, 95, 160].forEach((f, i) => {
          setTimeout(() => this.playTone(f, f * 0.75, 0.2, 'sawtooth', 0.17), i * 85);
        });
      }

      stunFull() {
        // Cartoon dizzy arpeggio
        [440, 554, 659, 880].forEach((f, idx) => {
          setTimeout(() => this.playTone(f, f * 1.08, 0.1, 'sine', 0.13), idx * 55);
        });
      }

      finisher() {
        // Comical launch whistle + pop
        this.playTone(240, 980, 0.28, 'sine', 0.2);
        setTimeout(() => this.playTone(150, 60, 0.18, 'square', 0.2), 180);
      }

      throwGalushka() {
        this.playTone(350, 210, 0.11, 'sine', 0.14);
      }

      drinkUzvar() {
        this.playTone(320, 480, 0.12, 'sine', 0.15);
        setTimeout(() => this.playTone(480, 720, 0.16, 'sine', 0.15), 110);
      }

      pickup() {

      }

      checkpoint() {
        [330, 440, 554, 659].forEach((f, i) => {
          setTimeout(() => this.playTone(f, f, 0.16, 'triangle', 0.15), i * 80);
        });
      }

      hurt() {

      defeat() {

      drawEmbroideryBorders() {
        // Traditional Ukrainian Rushnyk geometric square blocks on left & right edges (inspired by font reference)
        const border = this.add.graphics();
        const tileSize = 48;
        const marginY = 14;

        const drawOrnamentTile = (x, y, colorHex) => {
          // Outer & inner frames
          border.fillStyle(0xf8f3e6, 0.92);
          border.fillRect(x, y, tileSize, tileSize);
          border.lineStyle(2, colorHex, 1);
          border.strokeRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
          border.strokeRect(x + 6, y + 6, tileSize - 12, tileSize - 12);

          // Central diamond & 8-pointed Cossack star (Алатир / Ружа)
          const mx = x + tileSize / 2;
          const my = y + tileSize / 2;
          border.lineBetween(mx, y + 6, x + tileSize - 6, my);
          border.lineBetween(x + tileSize - 6, my, mx, y + tileSize - 6);
          border.lineBetween(mx, y + tileSize - 6, x + 6, my);
          border.lineBetween(x + 6, my, mx, y + 6);

          // Cross lines & corner dots
          border.lineBetween(mx, y + 2, mx, y + tileSize - 2);
          border.lineBetween(x + 2, my, x + tileSize - 2, my);
          border.fillStyle(colorHex, 1);
          border.fillRect(mx - 4, my - 4, 8, 8);
          border.fillRect(x + 9, y + 9, 4, 4);
          border.fillRect(x + tileSize - 13, y + 9, 4, 4);
          border.fillRect(x + 9, y + tileSize - 13, 4, 4);
          border.fillRect(x + tileSize - 13, y + tileSize - 13, 4, 4);
        };

        for (let row = 0; row < 10; row++) {
          const y = marginY + row * (tileSize + 3);
          const color = (row % 2 === 0) ? 0xc1121f : 0x1d1e2c; // Alternating Red & Black embroidery
          drawOrnamentTile(10, y, color);
          drawOrnamentTile(CONFIG.WIDTH - 10 - tileSize, y, color);
        }
      }

      openDifficultyModal() {
        if (this.difficultyModalOpen) return;
        this.difficultyModalOpen = true;
        this.transitionFastForward = true;
        this.diffModal.setVisible(true);
        this.diffModal.setScale(0.9);
        this.refreshDifficultyHighlight();
        SFX.itemFanfare();

        this.tweens.add({
          targets: this.diffModal,
          scale: 1,
          duration: 200,
          ease: 'Back.easeOut'
        });
      }

      moveDifficultySelection(delta) {
        const len = this.diffOptionCards.length;
        this.selectedDiffIndex = (this.selectedDiffIndex + delta + len) % len;
        SFX.speechBlip();
        this.refreshDifficultyHighlight();
      }

      refreshDifficultyHighlight() {
        this.diffOptionCards.forEach((item, idx) => {
          const active = idx === this.selectedDiffIndex;
          if (active) {
            item.box.setStrokeStyle(4, 0xffea00);
            item.box.setScale(1.02);
            item.optTitle.setColor('#ffea00');
          } else {
            item.box.setStrokeStyle(2, 0x8d99ae);
            item.box.setScale(1);
            item.optTitle.setColor('#ffffff');
          }
        });
      }

      confirmDifficultySelection() {
        if (!this.difficultyModalOpen || this.confirmingDifficulty) return;
        this.confirmingDifficulty = true;
        const chosen = this.diffOptionCards[this.selectedDiffIndex];
        GAME_STATE.difficulty = chosen ? chosen.mode : 'casual';
        SFX.checkpoint();

        this.cameras.main.fadeOut(360, 18, 19, 26);
        this.time.delayedCall(380, () => {
          this.scene.start('HutScene');
        });
      }

      startGame() {
        // If intro transition is already playing, a second press skips straight to Difficulty Selection
        if (this.startingGame) {
          if (!this.transitionFastForward && !this.difficultyModalOpen) {
            this.openDifficultyModal();
          }
          return;
        }
        this.startingGame = true;
        SFX.banduraStart();

        // Hide bottom prompt plaque so the scene feels cinematic
        this.tweens.add({
          targets: [this.footerBg, this.enterPrompt, this.authorText],
          alpha: 0,
          duration: 280
        });

        // Step 1: Wife steps out of the Khata doorway and calls Omelko to eat borsch
        this.doorWife.setVisible(true);
        this.tweens.add({
          targets: this.doorWife,
          y: this.khataDoorY - 6,
          duration: 140,
          yoyo: true,
          repeat: 2
        });

        const callBubble = this.add.container(620, 214);
        const cbBg = this.add.graphics();
        cbBg.fillStyle(0xfefae0, 0.98);
        cbBg.lineStyle(3, 0xc1121f, 1);
        cbBg.fillRoundedRect(-230, -44, 460, 84, 14);
        cbBg.strokeRoundedRect(-230, -44, 460, 84, 14);
        // Pointer toward Khata doorway
        cbBg.fillTriangle(72, 40, 92, 40, 88, 60);

        const cbText = this.add.text(0, -2, STRINGS.TITLE_WIFE_CALL, {
          fontFamily: "'Cormorant Infant', Georgia, serif",
          fontSize: '19px',
          fontStyle: 'bold',
          color: '#2b1810',
          align: 'center',
          lineSpacing: 5
        }).setOrigin(0.5);

        callBubble.add([cbBg, cbText]);
        callBubble.setScale(0.7);
        this.tweens.add({
          targets: callBubble,
          scale: 1,
          duration: 240,
          ease: 'Back.easeOut'
        });
        SFX.speechBlip();

        // Step 2: Give player plenty of time (3.8s) to read the wife's call before Omelko wakes up
        this.time.delayedCall(3800, () => {
          if (this.transitionFastForward) return;

          if (this.pipeSmokeTimer) this.pipeSmokeTimer.remove();
          this.recliningOmelko.setVisible(false);
          this.walkingOmelko.setVisible(true);
          SFX.jump(false);

          // Fade out the first bubble cleanly so they don't overlap
          this.tweens.add({
            targets: callBubble,
            alpha: 0,
            duration: 250
          });

          // Hop up from the haystack
          this.tweens.add({
            targets: this.walkingOmelko,
            y: this.hayY - 22,
            duration: 150,
            yoyo: true
          });

          // Omelko's excited reply bubble with comfortable width & reading time
          const replyBubble = this.add.container(this.hayX + 10, this.hayY - 68);
          const rbBg = this.add.graphics();
          rbBg.fillStyle(0xfefae0, 0.98);
          rbBg.lineStyle(2.5, 0x1d3557, 1);
          rbBg.fillRoundedRect(-175, -26, 350, 48, 12);
          rbBg.strokeRoundedRect(-175, -26, 350, 48, 12);
          rbBg.fillTriangle(-10, 22, 10, 22, 0, 34);

          const rbText = this.add.text(0, -2, STRINGS.TITLE_OMELKO_REPLY, {
            fontFamily: "'Cormorant Infant', Georgia, serif",
            fontSize: '18px',
            fontStyle: 'bold',
            color: '#1d3557'
          }).setOrigin(0.5);
          replyBubble.add([rbBg, rbText]);
          replyBubble.setScale(0.75);
          this.tweens.add({
            targets: replyBubble,
            scale: 1,
            duration: 200,
            ease: 'Back.easeOut'
          });
          SFX.speechBlip();

          // Wait 2.4s so player can comfortably read Omelko's reply before he walks to the door
          this.time.delayedCall(2400, () => {
            if (this.transitionFastForward) return;

            this.tweens.add({
              targets: replyBubble,
              alpha: 0,
              duration: 350,
              delay: 400
            });

            // Cheerful walking bobbing + footsteps
            const walkBob = this.tweens.add({
              targets: this.walkingOmelko,
              scaleY: 0.7,
              scaleX: 0.84,
              duration: 130,
              yoyo: true,
              repeat: -1
            });

            // Dust puffs while walking to the door
            const dustEvent = this.time.addEvent({
              delay: 180,
              repeat: 7,
              callback: () => {
                if (!this.walkingOmelko.visible) return;
                const d = this.add.image(this.walkingOmelko.x - 8, this.walkingOmelko.y + 18, 'particle_dust')
                  .setScale(0.7);
                this.tweens.add({
                  targets: d,
                  y: d.y - 10,
                  alpha: 0,
                  duration: 260,
                  onComplete: () => d.destroy()
                });
              }
            });

            this.tweens.add({
              targets: this.walkingOmelko,
              x: this.khataDoorX,
              y: this.khataDoorY,
              duration: 1550,
              ease: 'Sine.easeInOut',
              onComplete: () => {
                if (this.transitionFastForward) return;
                walkBob.stop();
                dustEvent.remove();
                SFX.checkpoint();

                // Omelko & his wife step inside the Khata -> Open Difficulty Selection Modal!
                this.tweens.add({
                  targets: [this.walkingOmelko, this.doorWife],
                  alpha: 0,
                  scale: 0.55,
                  duration: 280,
                  onComplete: () => {
                    this.openDifficultyModal();
                  }
                });
              }
            });
          });
        });
      }

      update(time, delta) {
        // Slowly rotate the windmill sails
        if (this.windmillBlades) {
          this.windmillBlades.rotation += 0.00045 * delta;
        }

        // Also allow Xbox Gamepad A or Start button to launch the game
        if (!this.startingGame && navigator.getGamepads) {
          const pads = navigator.getGamepads();
          const pad = pads && pads[0];
          if (pad && ((pad.buttons[0] && pad.buttons[0].pressed) || (pad.buttons[9] && pad.buttons[9].pressed))) {
            this.startGame();
          }
        }
      }
    }

      onAdvanceInput() {
        if (!this.cutsceneActive) return;

        // If an Item Acquired popup is currently open, advance through all 3 popups (0 -> 1 -> 2 -> end)
        if (this.itemPopupStep >= 0) {
          if (this.time.now < this.popupInputReadyTime) return;
          if (this.itemPopupStep < 2) {
            this.showItemPopup(this.itemPopupStep + 1);
          } else {
            this.endCutscene();
          }
          return;
        }

        this.showDialogueLine(this.currentLineIndex + 1);
      }

      endCutscene() {
        if (!this.cutsceneActive) return;
        this.cutsceneActive = false;
        this.itemPopupStep = -1;
        if (this.autoTimer) this.autoTimer.remove();

        this.bubbleContainer.setVisible(false);
        if (this.itemModal) this.itemModal.setVisible(false);
        this.skipHint.setVisible(false);
        if (this.skipBtnBg) this.skipBtnBg.setVisible(false);
        if (this.skipBtnTxt) this.skipBtnTxt.setVisible(false);
        this.walkPrompt.setVisible(true);
        this.doorIndicator.setVisible(true);
        this.player.sprite.setFlipX(false);

        this.tweens.add({
          targets: this.doorIndicator,
          y: 203,
          duration: 500,
          yoyo: true,
          repeat: -1
        });
      }

      update(time, delta) {
        if (!this.cutsceneActive) {
          this.player.update(time, delta);

          // Check if Cossack walked to the door on the right
          if (this.player.sprite.x >= this.doorX - 35) {
            SFX.checkpoint();
            this.scene.start('GameScene');
          }
        }
      }
    }

    /**
     * ============================================================================
     * 7. PLAYER CLASS (COSSACK OMELKO)
     * ============================================================================
     */
    class Player {
      constructor(scene, x, y) {
        this.scene = scene;
        this.sprite = scene.physics.add.sprite(x, y, 'cossack');
        this.sprite.setCollideWorldBounds(true);
        this.sprite.body.setSize(26, 52);
        this.sprite.body.setOffset(7, 6);
        this.sprite.body.setMaxVelocity(550, 900);

        // Stats & Inventory
        this.stamina = CONFIG.PLAYER.MAX_STAMINA;
        this.coins = 0;
        this.galushkas = CONFIG.PLAYER.START_GALUSHKAS;
        this.uzvarCharges = CONFIG.PLAYER.UZVAR_CHARGES;

        // Movement & Jump State
        this.facing = 1; // 1 = right, -1 = left
        this.lastGroundedTime = 0;
        this.lastJumpPressedTime = -9999;
        this.canDoubleJump = false;
        this.wasGrounded = false;
        this.isTiredRespawning = false;

        // Dodge Roll & Counter-Attack State
        this.isRolling = false;
        this.rollEndTime = 0;
        this.nextRollAllowedTime = 0;
        this.counterWindowEndTime = 0;
        this.invulnUntil = 0;
        this.dropThroughUntil = 0; // Allows Shift + Down to drop underground through the grass surface

        // 3-Hit Frying Pan Combo State
        this.comboStep = 0;
        this.lastAttackTime = 0;
        this.nextAttackAllowedTime = 0;

        // Dust particle cooldown
        this.nextDustTime = 0;

        // Setup Keyboard Input:
        // Movement ONLY via Arrow keys (Left/Right/Up/Down) + Space for Jump
        // Combat Actions: D = Frying Pan Attack, S = Throw Galushka, A = Drink Kissel (Heal), Shift = Roll
        this.keys = scene.input.keyboard.addKeys({
          leftArrow: Phaser.Input.Keyboard.KeyCodes.LEFT,
          rightArrow: Phaser.Input.Keyboard.KeyCodes.RIGHT,
          upArrow: Phaser.Input.Keyboard.KeyCodes.UP,
          downArrow: Phaser.Input.Keyboard.KeyCodes.DOWN,
          space: Phaser.Input.Keyboard.KeyCodes.SPACE,
          rollShift: Phaser.Input.Keyboard.KeyCodes.SHIFT,
          attackD: Phaser.Input.Keyboard.KeyCodes.D,
          throwS: Phaser.Input.Keyboard.KeyCodes.S,
          healA: Phaser.Input.Keyboard.KeyCodes.A
        });

        // Edge-triggered states for Gamepad & Touch buttons
        this.prevJumpDown = false;
        this.prevRollDown = false;
        this.prevAttackDown = false;
        this.prevThrowDown = false;
        this.prevHealDown = false;
      }

      readInputState() {
        const k = this.keys;
        const touch = this.scene.ui ? this.scene.ui.touchState : {};

        // Poll standard Xbox Gamepad via Web Gamepad API
        let gpLeft = false, gpRight = false, gpJump = false, gpRoll = false, gpAttack = false, gpThrow = false, gpHeal = false;
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        const pad = pads && pads[0];
        let gpDown = false;
        if (pad) {
          const axisX = pad.axes[0] || 0;
          const axisY = pad.axes[1] || 0;
          gpLeft = axisX < -0.35 || (pad.buttons[14] && pad.buttons[14].pressed);
          gpRight = axisX > 0.35 || (pad.buttons[15] && pad.buttons[15].pressed);
          gpDown = axisY > 0.5 || (pad.buttons[13] && pad.buttons[13].pressed);
          gpJump = Boolean(pad.buttons[0] && pad.buttons[0].pressed);   // Xbox A
          gpAttack = Boolean(pad.buttons[2] && pad.buttons[2].pressed); // Xbox X
          gpRoll = Boolean((pad.buttons[1] && pad.buttons[1].pressed) || (pad.buttons[5] && pad.buttons[5].pressed)); // B or RB
          gpThrow = Boolean(pad.buttons[3] && pad.buttons[3].pressed);  // Xbox Y
          gpHeal = Boolean(pad.buttons[4] && pad.buttons[4].pressed);   // Xbox LB
        }

        const moveLeft = k.leftArrow.isDown || touch.left || gpLeft;
        const moveRight = k.rightArrow.isDown || touch.right || gpRight;
        const moveDown = k.downArrow.isDown || Boolean(touch.down) || gpDown;
        const jumpDown = k.space.isDown || k.upArrow.isDown || Boolean(touch.jump) || gpJump;
        const rollDown = k.rollShift.isDown || Boolean(touch.roll) || gpRoll;
        const attackDown = k.attackD.isDown || Boolean(touch.attack) || gpAttack;
        const throwDown = k.throwS.isDown || Boolean(touch.throw) || gpThrow;
        const healDown = k.healA.isDown || Boolean(touch.heal) || gpHeal;

        const state = {
          moveLeft,
          moveRight,
          moveDown,
           rollDown,
          jumpDown,
          jumpJustPressed: jumpDown && !this.prevJumpDown,
          jumpJustReleased: !jumpDown && this.prevJumpDown,
          rollJustPressed: rollDown && !this.prevRollDown,
          attackJustPressed: attackDown && !this.prevAttackDown,
          throwJustPressed: throwDown && !this.prevThrowDown,
          healJustPressed: healDown && !this.prevHealDown
        };

        this.prevJumpDown = jumpDown;
        this.prevRollDown = rollDown;
        this.prevAttackDown = attackDown;
        this.prevThrowDown = throwDown;
        this.prevHealDown = healDown;

        return state;
      }

      update(time, delta) {
        if (this.isTiredRespawning) return;

        const input = this.readInputState();
        const body = this.sprite.body;
        const onFloor = body.blocked.down || body.touching.down;

        // Track grounded state for Coyote Time & Landing Squash
        if (onFloor) {
          if (!this.wasGrounded && body.velocity.y >= 0) {
            this.applySquashStretch(CONFIG.FEEL.LAND_SQUASH_X, CONFIG.FEEL.LAND_STRETCH_Y);
            this.spawnDust(5);
          }
          this.lastGroundedTime = time;
          this.canDoubleJump = true;
          this.escapingUnderground = false;
          this.jumpedFromUnderground = (body.bottom > CONFIG.GROUND_Y + 6);
        }
        this.wasGrounded = onFloor;

        // Clear underground escape flag once the player has risen above ground level and starts descending or lands
        if (this.escapingUnderground && (body.bottom <= CONFIG.GROUND_Y + 12 || onFloor)) {
          this.escapingUnderground = false;
          this.jumpedFromUnderground = false;
        }

        // Check active Roll expiration
        if (this.isRolling && time >= this.rollEndTime) {
          this.isRolling = false;
          this.sprite.setTexture('cossack');
          this.sprite.setAngle(0);
          body.setSize(26, 52);
          body.setOffset(7, 6);
        }

        // Shift + Down: Intentionally dive underground only if on grass and pressing Roll specifically while holding Down
        const onGrassSurface = onFloor && Math.abs(body.bottom - CONFIG.GROUND_Y) <= 18;
        if (onGrassSurface && input.moveDown && input.rollJustPressed && time >= this.dropThroughUntil) {
          this.dropThroughUntil = time + 360;
          this.jumpedFromUnderground = true;
          this.canDoubleJump = true;
          this.sprite.y += 10;
          body.setVelocityY(260);
          this.applySquashStretch(0.78, 1.25);
          this.spawnDust(5);
          SFX.roll();
        } else if (input.rollJustPressed && !this.isRolling && time >= this.nextRollAllowedTime) {
          // Start Dodge Roll
          this.startRoll(time, input);
        }

        // Horizontal Movement
        if (this.isRolling) {
          body.setVelocityX(this.facing * CONFIG.PLAYER.ROLL_SPEED);
          this.sprite.angle += this.facing * 18;
          if (time > this.nextDustTime) {
            this.spawnDust(1);
            this.nextDustTime = time + 55;
          }
        } else {
          if (input.moveLeft) {
            this.facing = -1;
            this.sprite.setFlipX(true);
            body.setVelocityX(-CONFIG.PLAYER.SPEED);
            if (onFloor && time > this.nextDustTime) {
              this.spawnDust(1);
              this.nextDustTime = time + 140;
            }
          } else if (input.moveRight) {
            this.facing = 1;
            this.sprite.setFlipX(false);
            body.setVelocityX(CONFIG.PLAYER.SPEED);
            if (onFloor && time > this.nextDustTime) {
              this.spawnDust(1);
              this.nextDustTime = time + 140;
            }
          } else {
            body.setVelocityX(body.velocity.x * 0.78);
            if (Math.abs(body.velocity.x) < 12) body.setVelocityX(0);
          }
        }

        // Jump Buffer & Coyote Time Jump + Double Jump
        if (input.jumpJustPressed) {
          this.lastJumpPressedTime = time;
        }

        const withinJumpBuffer = (time - this.lastJumpPressedTime) <= CONFIG.PLAYER.JUMP_BUFFER_MS;
        const withinCoyote = (time - this.lastGroundedTime) <= CONFIG.PLAYER.COYOTE_TIME_MS;
        const isCurrentlyUnderground = body.bottom > CONFIG.GROUND_Y + 4;

        if (withinJumpBuffer && withinCoyote) {
          // Primary Jump
          this.jumpedFromUnderground = isCurrentlyUnderground;
          if (isCurrentlyUnderground) {
            // Strong spring-leap out of the catacombs up onto the grass surface
            body.setVelocityY(-740);
            this.escapingUnderground = true;
          } else {
            body.setVelocityY(CONFIG.PLAYER.JUMP_VELOCITY);
          }
          this.lastJumpPressedTime = -9999;
          this.lastGroundedTime = -9999;
          this.applySquashStretch(CONFIG.FEEL.JUMP_SQUASH_X, CONFIG.FEEL.JUMP_STRETCH_Y);
          this.spawnDust(4);
          SFX.jump(false);
        } else if (input.jumpJustPressed && !withinCoyote && this.canDoubleJump) {
          // Double Jump in mid-air
          if (isCurrentlyUnderground || this.jumpedFromUnderground) {
            body.setVelocityY(-720);
            this.escapingUnderground = true;
          } else {
            body.setVelocityY(CONFIG.PLAYER.DOUBLE_JUMP_VELOCITY);
          }
          this.canDoubleJump = false;
          this.lastJumpPressedTime = -9999;
          this.applySquashStretch(CONFIG.FEEL.JUMP_SQUASH_X, CONFIG.FEEL.JUMP_STRETCH_Y);
          this.spawnDust(4);
          SFX.jump(true);
        }

        // Variable Jump Height when releasing jump key early (disabled while underground or escaping so jump is never throttled)
        if (input.jumpJustReleased && body.velocity.y < 0 && !this.escapingUnderground && !isCurrentlyUnderground) {
          body.setVelocityY(body.velocity.y * CONFIG.PLAYER.JUMP_CUT_MULTIPLIER);
        }

        // Combat Actions (only inside GameScene or test swings in Hut)
        if (input.attackJustPressed && time >= this.nextAttackAllowedTime) {
          this.performPanAttack(time);
        }
        if (input.throwJustPressed && this.scene.throwPlayerGalushka) {
          this.scene.throwPlayerGalushka(time);
        }
        if (input.healJustPressed && this.scene.drinkPlayerUzvar) {
          this.scene.drinkPlayerUzvar();
        }

        // Smoothly restore Squash & Stretch scale toward 1.0
        this.sprite.scaleX = Phaser.Math.Linear(this.sprite.scaleX, 1, 0.22);
        this.sprite.scaleY = Phaser.Math.Linear(this.sprite.scaleY, 1, 0.22);

        // Invulnerability flicker visual
        if (time < this.invulnUntil && !this.isRolling) {
          this.sprite.alpha = Math.floor(time / 60) % 2 === 0 ? 0.45 : 1;
        } else {
          this.sprite.alpha = 1;
        }
      }

      startRoll(time, input) {
        if (input.moveLeft) {
          this.facing = -1;
          this.sprite.setFlipX(true);
        } else if (input.moveRight) {
          this.facing = 1;
          this.sprite.setFlipX(false);
        }

        this.isRolling = true;
        this.rollEndTime = time + CONFIG.PLAYER.ROLL_DURATION_MS;
        this.nextRollAllowedTime = time + CONFIG.PLAYER.ROLL_COOLDOWN_MS;
        this.invulnUntil = this.rollEndTime + 60; // i-frames during roll
        this.counterWindowEndTime = this.rollEndTime + CONFIG.PLAYER.COUNTER_WINDOW_MS;

        this.sprite.setTexture('cossack_roll');
        this.applySquashStretch(1.2, 0.8);
        this.spawnDust(4);
        SFX.roll();
      }

      performPanAttack(time) {
        // Cancel roll if attacking out of a roll (triggers Counter-Attack!)
        if (this.isRolling) {
          this.isRolling = false;
          this.sprite.setTexture('cossack');
          this.sprite.setAngle(0);
        }

        const isCounterAttack = time <= this.counterWindowEndTime;
        if (isCounterAttack) {
          this.counterWindowEndTime = 0;
        }

        // Advance 3-hit combo
        if (time - this.lastAttackTime > CONFIG.PLAYER.COMBO_RESET_MS) {
          this.comboStep = 1;
        } else {
          this.comboStep = (this.comboStep % 3) + 1;
        }
        this.lastAttackTime = time;
        this.nextAttackAllowedTime = time + CONFIG.PLAYER.ATTACK_COOLDOWN_MS;

        const usingSaber = Boolean(GAME_STATE.hasSaber || (this.scene && this.scene.currentLevel === 2));
        SFX.swing(this.comboStep, usingSaber);

        // Visual Frying Pan or Damascus Cossack Saber Slash Arc
        const slashX = this.sprite.x + this.facing * (usingSaber ? 40 : 36);
        const slashY = this.sprite.y - 2;
        const slash = this.scene.add.image(slashX, slashY, usingSaber ? 'saber_slash' : 'pan_slash');
        slash.setFlipX(this.facing < 0);

        if (isCounterAttack) {
          slash.setTint(usingSaber ? 0x00f5d4 : 0xffea00);
          slash.setScale(1.38);
        } else if (this.comboStep === 3) {
          slash.setTint(usingSaber ? 0xffd166 : 0xff9f1c);
          slash.setScale(1.3);
        } else if (this.comboStep === 2) {
          slash.setFlipY(true);
          slash.setScale(1.08);
        }

        this.scene.tweens.add({
          targets: slash,
          alpha: 0,
          scaleX: slash.scaleX * 1.22,
          scaleY: slash.scaleY * 1.22,
          duration: 145,
          onComplete: () => slash.destroy()
        });

        // Slight forward step impulse
        this.sprite.body.setVelocityX(this.facing * 145);
        this.applySquashStretch(1.18, 0.88);

        // Delegate hit detection to GameScene if combat exists
        if (this.scene.handlePlayerMeleeHit) {
          this.scene.handlePlayerMeleeHit(this.comboStep, isCounterAttack);
        }
      }

      takeDamage(amount, sourceX) {
        const now = this.scene.time.now;
        if (now < this.invulnUntil || this.isRolling || this.isTiredRespawning) return false;

        const finalDamage = Math.round(amount * GAME_STATE.getEnemyDamageMultiplier());
        this.stamina = Math.max(0, this.stamina - finalDamage);
        this.invulnUntil = now + CONFIG.PLAYER.INVULN_AFTER_HIT_MS;
        SFX.hurt();

        // Knockback & Camera Shake
        const dir = this.sprite.x < sourceX ? -1 : 1;
        this.sprite.body.setVelocity(dir * 260, -240);
        this.scene.cameras.main.shake(CONFIG.FEEL.SHAKE_HEAVY_DURATION, CONFIG.FEEL.SHAKE_HEAVY_INTENSITY);

        // Red flash tint
        this.sprite.setTint(0xff4d4d);
        this.scene.time.delayedCall(160, () => {
          if (this.sprite && this.sprite.active) this.sprite.clearTint();
        });

        if (this.stamina <= 0 && this.scene.handlePlayerTired) {
          this.scene.handlePlayerTired();
        }
        return true;
      }

      applySquashStretch(scaleX, scaleY) {
        this.sprite.setScale(scaleX, scaleY);
      }

      spawnDust(count = 3) {
        for (let i = 0; i < count; i++) {
          const p = this.scene.add.image(
            this.sprite.x + Phaser.Math.Between(-12, 12),
            this.sprite.y + 24,
            'particle_dust'
          );
          p.setScale(Phaser.Math.FloatBetween(0.5, 1.1));
          this.scene.tweens.add({
            targets: p,
            x: p.x + Phaser.Math.Between(-24, 24),
            y: p.y - Phaser.Math.Between(8, 22),
            alpha: 0,
            scale: 0.2,
            duration: Phaser.Math.Between(220, 380),
            onComplete: () => p.destroy()
          });
        }
      }
    }

    /**
     * ============================================================================
     * 8. ENEMY BASE CLASS & SUBCLASSES (NON-LETHAL STUN & FINISHERS)
     * ============================================================================
     */
    class Enemy {
      constructor(scene, x, y, texture, maxStun) {
        this.scene = scene;
        this.sprite = scene.physics.add.sprite(x, y, texture);
        this.sprite.setCollideWorldBounds(true);
        this.sprite.enemyRef = this;

        this.maxStun = Math.round(maxStun * GAME_STATE.getEnemyHpMultiplier());
        this.stun = 0;
        this.isStunned = false;
        this.stunEndTime = 0;
        this.isFinished = false;
        this.isTelegraphing = false;

        // Overhead UI: Classic Red Health Bar (starts full red and decreases to 0) + Telegraph Warning ("!") + Dizzy Stars
        this.uiContainer = scene.add.container(x, y - 42);
        this.barBg = scene.add.rectangle(0, 0, 44, 7, 0x1b1d24).setStrokeStyle(1, 0xffffff);
        this.barFill = scene.add.rectangle(-21, 0, 42, 5, 0xe63946).setOrigin(0, 0.5);
        this.telegraphLabel = scene.add.text(0, -18, '!', {
          fontSize: '24px',
          fontStyle: 'bold',
          color: '#ff002b',
          stroke: '#ffffff',
          strokeThickness: 4
        }).setOrigin(0.5).setVisible(false);

        this.stunPrompt = scene.add.text(0, -20, STRINGS.STUNNED_PROMPT, {
          fontSize: '12px',
          fontStyle: 'bold',
          color: '#ffea00',
          backgroundColor: '#1d1e2c',
          padding: { x: 4, y: 2 }
        }).setOrigin(0.5).setVisible(false);

        // Orbiting dizzy stars when stunned
        this.stars = [
          scene.add.image(-14, -8, 'particle_star').setVisible(false),
          scene.add.image(0, -12, 'particle_star').setVisible(false),
          scene.add.image(14, -8, 'particle_star').setVisible(false)
        ];

        this.uiContainer.add([this.barBg, this.barFill, this.telegraphLabel, this.stunPrompt, ...this.stars]);
      }

      updateBase(time) {
        if (this.isFinished || !this.sprite.active) return false;

        // Sync overhead Health Bar position (classic decreasing red bar: 100% -> 0%)
        this.uiContainer.setPosition(this.sprite.x, this.sprite.y - this.sprite.height * 0.65);
        const hpRatio = Phaser.Math.Clamp(1 - (this.stun / this.maxStun), 0, 1);
        this.barFill.width = 42 * hpRatio;

        // Smoothly recover Squash & Stretch
        this.sprite.scaleX = Phaser.Math.Linear(this.sprite.scaleX, 1, 0.2);
        this.sprite.scaleY = Phaser.Math.Linear(this.sprite.scaleY, 1, 0.2);

        // Handle Stunned ("Оглушений") state
        if (this.isStunned) {
          this.sprite.body.setVelocityX(this.sprite.body.velocity.x * 0.85);
          // Animate orbiting stars overhead
          this.stars.forEach((star, idx) => {
            const angle = (time * 0.007) + (idx * (Math.PI * 2 / 3));
            star.x = Math.cos(angle) * 18;
            star.y = -8 + Math.sin(angle) * 5;
          });

          if (time >= this.stunEndTime) {
            this.recoverFromStun();
          }
          return false; // Skip AI movement while stunned
        }

        return true;
      }

      receiveStunHit(stunAmount, fromX, isHeavy = false) {
        if (this.isFinished) return;

        // If ALREADY stunned, hitting triggers the Comical Non-Lethal Finisher!
        if (this.isStunned) {
          this.triggerFinisher(fromX);
          return;
        }

        this.stun = Math.min(this.maxStun, this.stun + stunAmount);
        SFX.panHit(isHeavy);

        // Hit-stop, Camera Shake, Squash & Stretch, Knockback & Sparks
        this.scene.triggerHitStop(CONFIG.FEEL.HIT_STOP_MS);
        this.scene.cameras.main.shake(
          isHeavy ? CONFIG.FEEL.SHAKE_HEAVY_DURATION : CONFIG.FEEL.SHAKE_LIGHT_DURATION,
          isHeavy ? CONFIG.FEEL.SHAKE_HEAVY_INTENSITY : CONFIG.FEEL.SHAKE_LIGHT_INTENSITY
        );

        const dir = this.sprite.x >= fromX ? 1 : -1;
        this.sprite.body.setVelocity(dir * CONFIG.PLAYER.KNOCKBACK_X, CONFIG.PLAYER.KNOCKBACK_Y);
        this.sprite.setScale(1.3, 0.75);
        this.sprite.setTintFill(0xffffff);
        this.scene.time.delayedCall(90, () => {
          if (this.sprite && this.sprite.active && !this.isTelegraphing) {
            this.sprite.clearTint();
          }
        });

        this.scene.spawnHitParticles(this.sprite.x, this.sprite.y);

        // Check if Stun Bar reached 100%
        if (this.stun >= this.maxStun) {
          this.enterStunState();
        }
      }

      enterStunState() {
        this.isStunned = true;
        this.isTelegraphing = false;
        this.telegraphLabel.setVisible(false);
        this.stunEndTime = this.scene.time.now + CONFIG.ENEMY.STUN_DURATION_MS;
        this.barFill.setFillStyle(0xe63946);
        this.stunPrompt.setVisible(true);
        this.stars.forEach(s => s.setVisible(true));
        this.sprite.setAngle(0);
        this.sprite.clearTint();
        SFX.stunFull();
      }

      recoverFromStun() {
        this.isStunned = false;
        this.stun = Math.floor(this.maxStun * 0.35); // Recover 65% of red health bar if player missed finisher
        this.barFill.setFillStyle(0xe63946);
        this.stunPrompt.setVisible(false);
        this.stars.forEach(s => s.setVisible(false));
        this.sprite.setAngle(0);
      }

      triggerFinisher(fromX) {
        this.isFinished = true;
        this.isStunned = false;
        this.uiContainer.setVisible(false);
        this.sprite.body.enable = false;

        SFX.finisher();
        this.scene.triggerHitStop(CONFIG.FEEL.FINISHER_HIT_STOP_MS);
        this.scene.cameras.main.shake(CONFIG.FEEL.SHAKE_HEAVY_DURATION, CONFIG.FEEL.SHAKE_HEAVY_INTENSITY);
        this.scene.enemiesStunnedCount++;

        // Spawn Loot (Chervintsi, Food, Galushkas)
        this.scene.spawnLoot(this.sprite.x, this.sprite.y);

        // Choose one of 3 comical non-lethal finishers: Barrel, Clay Pot, or Sky Star Launch
        const roll = Phaser.Math.Between(0, 2);
        const dir = this.sprite.x >= fromX ? 1 : -1;

        if (roll === 0 || roll === 1) {
          // Stuffed into a Barrel or Clay Pot that hops & wiggles!
          const propKey = roll === 0 ? 'prop_barrel' : 'prop_pot';
          const label = roll === 0 ? STRINGS.FINISHER_BARREL : STRINGS.FINISHER_POT;
          this.scene.showFloatingText(this.sprite.x, this.sprite.y - 35, label, '#ffea00');

          const prop = this.scene.add.image(this.sprite.x, this.sprite.y + 4, propKey);
          this.sprite.setPosition(prop.x, prop.y - 22);
          this.sprite.setFlipY(true); // Feet sticking out!
          this.sprite.setScale(0.8);

          // Comical wiggling animation
          this.scene.tweens.add({
            targets: [prop, this.sprite],
            angle: { from: -8, to: 8 },
            duration: 240,
            yoyo: true,
            repeat: -1
          });
        } else {
          // Launched into the sky with a twinkling star!
          this.scene.showFloatingText(this.sprite.x, this.sprite.y - 35, STRINGS.FINISHER_SKY, '#00f5d4');
          this.scene.tweens.add({
            targets: this.sprite,
            x: this.sprite.x + dir * 240,
            y: -60,
            angle: 720,
            scale: 0.1,
            duration: 750,
            ease: 'Quad.easeIn',
            onComplete: () => {
              // Twinkle star in the sky
              const twinkle = this.scene.add.image(this.sprite.x, 55, 'particle_star').setScale(2.8);
              this.scene.tweens.add({
                targets: twinkle,
                scale: 0,
                angle: 180,
                duration: 450,
                onComplete: () => twinkle.destroy()
              });
              this.sprite.destroy();
            }
          });
        }
      }
    }

    /**
     * SUBCLASS A: Guard Goose (Гусак-охоронець)
     * Patrols back and forth; can flap its wings to fly-jump onto higher platforms
     * and chase the Cossack after a clear 0.5s telegraph!
     */
    class GooseEnemy extends Enemy {
      constructor(scene, x, y, minX, maxX) {
        super(scene, x, y, 'enemy_goose', CONFIG.ENEMY.GOOSE.MAX_STUN);
        this.minX = minX;
        this.maxX = maxX;
        this.patrolDir = 1;
        this.state = 'PATROL'; // PATROL, TELEGRAPH, CHARGE, COOLDOWN
        this.stateEndTime = 0;
        this.chargeDir = 1;
        this.nextJumpAllowedTime = 0;
      }

      tryWingJump(time, boostFactor = 1) {
        const onFloor = this.sprite.body.blocked.down || this.sprite.body.touching.down;
        if (!onFloor || time < this.nextJumpAllowedTime) return false;

        this.nextJumpAllowedTime = time + CONFIG.ENEMY.GOOSE.JUMP_COOLDOWN_MS;
        this.sprite.body.setVelocityY(CONFIG.ENEMY.GOOSE.JUMP_VELOCITY * boostFactor);
        this.sprite.setScale(0.78, 1.28);
        SFX.jump(true);

        // Feather / dust puff under wings
        for (let i = 0; i < 3; i++) {
          const p = this.scene.add.image(
            this.sprite.x + Phaser.Math.Between(-12, 12),
            this.sprite.y + 16,
            'particle_dust'
          ).setScale(0.75);
          this.scene.tweens.add({
            targets: p,
            y: p.y + 14,
            alpha: 0,
            duration: 240,
            onComplete: () => p.destroy()
          });
        }
        return true;
      }

      update(time, player) {
        if (!this.updateBase(time)) return;

        const distToPlayer = Phaser.Math.Distance.Between(this.sprite.x, this.sprite.y, player.sprite.x, player.sprite.y);
        const verticalDiff = this.sprite.y - player.sprite.y; // Positive when player is higher than goose
        const playerWithinHeight = Math.abs(verticalDiff) < 190;

        if (this.state === 'PATROL') {
          this.sprite.body.setVelocityX(this.patrolDir * CONFIG.ENEMY.GOOSE.PATROL_SPEED);
          this.sprite.setFlipX(this.patrolDir < 0);

          if (this.sprite.x >= this.maxX) this.patrolDir = -1;
          if (this.sprite.x <= this.minX) this.patrolDir = 1;

          // Occasionally flutter up onto a nearby elevated platform while patrolling
          if (Math.random() < 0.008) {
            this.tryWingJump(time, 0.92);
          }

          // Spot player (even on a higher platform!) and start clearly telegraphed attack
          if (distToPlayer < CONFIG.ENEMY.GOOSE.AGGRO_RANGE && playerWithinHeight) {
            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.chargeDir = player.sprite.x >= this.sprite.x ? 1 : -1;
            this.sprite.setFlipX(this.chargeDir < 0);
            this.sprite.body.setVelocityX(0);
            this.sprite.setTint(0xffbe0b);
            this.telegraphLabel.setVisible(true);
            this.stateEndTime = time + CONFIG.ENEMY.TELEGRAPH_MS;
            SFX.telegraph();
          }
        } else if (this.state === 'TELEGRAPH') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.state = 'CHARGE';
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.setTint(0xff6b6b);
            this.stateEndTime = time + 800;

            // If player is on a platform above the goose, flap wings and leap upward!
            if (verticalDiff > 42) {
              this.tryWingJump(time, verticalDiff > 115 ? 1.08 : 0.96);
            }
          }
        } else if (this.state === 'CHARGE') {
          this.sprite.body.setVelocityX(this.chargeDir * CONFIG.ENEMY.GOOSE.CHARGE_SPEED);

          // If player jumps higher mid-charge or goose bumps into a step, flutter up!
          if (verticalDiff > 50 || this.sprite.body.blocked.left || this.sprite.body.blocked.right) {
            this.tryWingJump(time, 0.98);
          }

          // Check collision with player during charge; end charge after landing a hit so it never multi-hits
          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            player.takeDamage(CONFIG.ENEMY.GOOSE.DAMAGE, this.sprite.x);
            this.state = 'COOLDOWN';
            this.sprite.clearTint();
            this.sprite.body.setVelocityX(-this.chargeDir * 110);
            this.stateEndTime = time + CONFIG.ENEMY.GOOSE.COOLDOWN_MS;
            return;
          }
          if (time >= this.stateEndTime) {
            this.state = 'COOLDOWN';
            this.sprite.clearTint();
            this.sprite.body.setVelocityX(0);
            this.stateEndTime = time + CONFIG.ENEMY.GOOSE.COOLDOWN_MS;
          }
        } else if (this.state === 'COOLDOWN') {
          if (time >= this.stateEndTime) {
            this.state = 'PATROL';
          }
        }
      }
    }

    /**
     * SUBCLASS B: Pesyholovets / Leshy (Песиголовець)
     * Runs on the ground surface, dives underground to hide from Omelko when he gets close,
     * can leap back up to the surface, and hurls stones!
     */
    class LeshyEnemy extends Enemy {
      constructor(scene, x, y, minX, maxX) {
        super(scene, x, y, 'enemy_leshy', CONFIG.ENEMY.LESHY.MAX_STUN);
        this.minX = minX !== undefined ? minX : Math.max(100, x - 180);
        this.maxX = maxX !== undefined ? maxX : Math.min(CONFIG.WORLD_WIDTH - 100, x + 180);
        this.walkDir = -1;
        this.state = 'PATROL'; // PATROL, TELEGRAPH, COOLDOWN
        this.stateEndTime = 0;
        this.nextThrowTime = 0;
        this.burrowPassUntil = 0;
        this.nextBurrowTime = scene.time.now + Phaser.Math.Between(900, 1800);
      }

      isUnderground() {
        return this.sprite.body.bottom > CONFIG.GROUND_Y + 22;
      }

      diveUnderground(time) {
        this.burrowPassUntil = time + 480;
        this.nextBurrowTime = time + CONFIG.ENEMY.LESHY.BURROW_COOLDOWN_MS;
        this.sprite.y += 10;
        this.sprite.body.setVelocityY(290);
        this.sprite.setScale(0.75, 1.28);
        SFX.roll();

        // Dirt/pebble burst when burrowing underground
        for (let i = 0; i < 5; i++) {
          const d = this.scene.add.image(
            this.sprite.x + Phaser.Math.Between(-14, 14),
            CONFIG.GROUND_Y + 4,
            'particle_dust'
          ).setTint(0x6f4518).setScale(0.85);
          this.scene.tweens.add({
            targets: d,
            y: d.y - Phaser.Math.Between(12, 28),
            x: d.x + Phaser.Math.Between(-18, 18),
            alpha: 0,
            duration: 320,
            onComplete: () => d.destroy()
          });
        }
      }

      leapToSurface(time) {
        const onFloor = this.sprite.body.blocked.down || this.sprite.body.touching.down;
        if (!onFloor) return;

        this.nextBurrowTime = time + CONFIG.ENEMY.LESHY.BURROW_COOLDOWN_MS;
        this.sprite.body.setVelocityY(CONFIG.ENEMY.LESHY.SURFACE_JUMP_VEL);
        this.sprite.setScale(0.78, 1.26);
        SFX.jump(false);

        for (let i = 0; i < 4; i++) {
          const d = this.scene.add.image(
            this.sprite.x + Phaser.Math.Between(-12, 12),
            this.sprite.y + 18,
            'particle_dust'
          ).setTint(0x6f4518).setScale(0.8);
          this.scene.tweens.add({
            targets: d,
            y: d.y - 16,
            alpha: 0,
            duration: 280,
            onComplete: () => d.destroy()
          });
        }
      }

      update(time, player) {
        if (!this.updateBase(time)) return;

        const dist = Phaser.Math.Distance.Between(this.sprite.x, this.sprite.y, player.sprite.x, player.sprite.y);
        const horizDist = Math.abs(this.sprite.x - player.sprite.x);
        const playerUnderground = player.sprite.body.bottom > CONFIG.GROUND_Y + 20;
        const selfUnderground = this.isUnderground();
        const onFloor = this.sprite.body.blocked.down || this.sprite.body.touching.down;

        // Dynamic surface <-> underground transitions:
        // 1. If on the surface and Omelko approaches on the surface, hide underground!
        if (!selfUnderground && !playerUnderground && onFloor && horizDist < CONFIG.ENEMY.LESHY.HIDE_DISTANCE && time >= this.nextBurrowTime) {
          this.diveUnderground(time);
        }
        // 2. If underground and Omelko either chases down into the tunnel OR moves away on the surface, leap back up to the surface!
        else if (selfUnderground && onFloor && time >= this.nextBurrowTime) {
          if ((playerUnderground && horizDist < 140) || (!playerUnderground && horizDist > 260 && horizDist < 460)) {
            this.leapToSurface(time);
          }
        }

        if (this.state === 'PATROL') {
          this.sprite.body.setVelocityX(this.walkDir * CONFIG.ENEMY.LESHY.WALK_SPEED);
          this.sprite.setFlipX(this.walkDir < 0);

          if (this.sprite.x >= this.maxX || this.sprite.body.blocked.right) {
            this.walkDir = -1;
          } else if (this.sprite.x <= this.minX || this.sprite.body.blocked.left) {
            this.walkDir = 1;
          }

          if (dist < CONFIG.ENEMY.LESHY.AGGRO_RANGE && time >= this.nextThrowTime) {
            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.sprite.body.setVelocityX(0);
            const faceDir = player.sprite.x >= this.sprite.x ? 1 : -1;
            this.sprite.setFlipX(faceDir < 0);
            this.telegraphLabel.setVisible(true);
            this.sprite.setTint(0xffbe0b);
            this.sprite.setScale(1.15, 0.85);
            this.stateEndTime = time + CONFIG.ENEMY.TELEGRAPH_MS;
            SFX.telegraph();
          }
        } else if (this.state === 'TELEGRAPH') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            this.sprite.setScale(0.85, 1.2);
            this.scene.spawnPinecone(this.sprite.x, this.sprite.y - 10, player.sprite.x, player.sprite.y);
            this.state = 'COOLDOWN';
            this.stateEndTime = time + 320;
            this.nextThrowTime = time + CONFIG.ENEMY.LESHY.COOLDOWN_MS;

            // After throwing a stone on the surface, often duck underground to evade retaliation
            if (!selfUnderground && onFloor && horizDist < 290 && time >= this.nextBurrowTime) {
              this.diveUnderground(time);
            }
          }
        } else if (this.state === 'COOLDOWN') {
          this.sprite.body.setVelocityX(this.walkDir * (CONFIG.ENEMY.LESHY.WALK_SPEED * 0.65));
          if (time >= this.stateEndTime) {
            this.state = 'PATROL';
          }
        }
      }
    }

    /**
     * SUBCLASS C: Chick (Курча — summoned by the Mad Rooster Boss)
     */
    class ChickEnemy extends Enemy {
      constructor(scene, x, y) {
        super(scene, x, y, 'enemy_chick', CONFIG.ENEMY.CHICK.MAX_STUN);
        this.nextHopTime = 0;
      }

      update(time, player) {
        if (!this.updateBase(time)) return;

        const dir = player.sprite.x >= this.sprite.x ? 1 : -1;
        this.sprite.setFlipX(dir < 0);
        this.sprite.body.setVelocityX(dir * CONFIG.ENEMY.CHICK.SPEED);

        if ((this.sprite.body.blocked.down || this.sprite.body.touching.down) && time > this.nextHopTime) {
          this.sprite.body.setVelocityY(-240);
          this.nextHopTime = time + Phaser.Math.Between(600, 1000);
        }

        if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
          player.takeDamage(CONFIG.ENEMY.CHICK.DAMAGE, this.sprite.x);
        }
      }
    }

    /**
     * ============================================================================
     * 9. BOSS CLASS: MAD ROOSTER ("СКАЖЕНИЙ ПІВЕНЬ КОРНІЙ")
     * 3 Phases/Moves (Lunge, Jump + Ground Shockwave, Summon Chicks).
     * Stun bar must be filled and finished TWICE.
     * ============================================================================
     */
    class MadRoosterBoss extends Enemy {
      constructor(scene, x, y) {
        super(scene, x, y, 'boss_rooster', CONFIG.ENEMY.BOSS_ROOSTER.MAX_STUN);
        this.sprite.body.setSize(68, 82);
        this.sprite.body.setOffset(11, 8);

        this.stage = 1; // 1 or 2 (2 finishers required)
        this.active = false;
        this.state = 'IDLE'; // IDLE, TELEGRAPH, LUNGE, PECK_FLURRY, JUMP_SLAM, SUMMON, COOLDOWN
        this.nextMove = 'LUNGE';
        this.moveCycle = 0;
        this.stateEndTime = 0;
        this.lungeDir = -1;
        this.waitingForSlamLand = false;

        // Anti-spam 1-2 hit window & aggressive counter-attack tracking
        this.hitsTakenInWindow = 0;
        this.allowedWindowHits = 2;
        this.isCounterTelegraph = false;
        this.chainedLungeCount = 0;
        this.peckBurstStep = 0;
        this.nextPeckBurstTime = 0;
        this.lastGuardNoticeTime = 0;
      }

      activate() {
        if (this.active) return;
        this.active = true;
        this.enterCooldownWindow(this.scene.time.now, 650);
        SFX.roosterCrow();
      }

      enterCooldownWindow(time, durationMs) {
        this.state = 'COOLDOWN';
        this.isTelegraphing = false;
        this.isCounterTelegraph = false;
        this.telegraphLabel.setVisible(false);
        this.sprite.setAngle(0);
        this.sprite.clearTint();
        this.stateEndTime = time + durationMs;
        this.hitsTakenInWindow = 0;
        // Give the player a balanced window for strictly 1 or 2 hits before the Rooster retaliates!
        this.allowedWindowHits = (this.stage === 2 && Math.random() < 0.45) ? 1 : Phaser.Math.Between(1, 2);
      }

      startCounterAttack(time, targetX) {
        if (this.isStunned || this.isFinished) return;

        this.state = 'TELEGRAPH';
        this.isTelegraphing = true;
        this.isCounterTelegraph = true;
        this.telegraphLabel.setText('⚡!').setVisible(true);

        this.lungeDir = targetX >= this.sprite.x ? 1 : -1;
        this.sprite.setFlipX(this.lungeDir < 0);
        this.sprite.setTint(0xff3b00);
        this.sprite.setScale(1.24, 0.78);

        // Slight furious wing-hop back/up as he prepares to strike back
        this.sprite.body.setVelocity(-this.lungeDir * 110, -160);

        const dist = Math.abs(targetX - this.sprite.x);
        if (dist < 175) {
          this.nextMove = Math.random() < 0.68 ? 'PECK_FLURRY' : 'JUMP_SLAM';
        } else {
          this.nextMove = Math.random() < 0.65 ? 'LUNGE' : 'JUMP_SLAM';
        }

        const counterTelMs = CONFIG.ENEMY.BOSS_ROOSTER.COUNTER_TELEGRAPH_MS * (this.stage === 2 ? 0.85 : 1);
        this.stateEndTime = time + counterTelMs;
        SFX.telegraph();

        if (time - this.lastGuardNoticeTime > 650) {
          this.lastGuardNoticeTime = time;
          this.scene.showFloatingText(this.sprite.x, this.sprite.y - 68, '⚡ КОНТРАТАКА ПІВНЯ!', '#ffbe0b');
        }
      }

      receiveStunHit(stunAmount, fromX, isHeavy = false) {
        if (this.isFinished) return;

        // If ALREADY stunned, hitting triggers the Comical Non-Lethal Finisher!
        if (this.isStunned) {
          this.triggerFinisher(fromX);
          return;
        }

        const now = this.scene.time.now;
        const inOpenWindow = (this.state === 'COOLDOWN') && (this.hitsTakenInWindow < this.allowedWindowHits);

        if (inOpenWindow) {
          // Clean hit inside the 1-2 hit punish window!
          this.hitsTakenInWindow++;
          this.stun = Math.min(this.maxStun, this.stun + stunAmount);
          SFX.panHit(isHeavy);

          this.scene.triggerHitStop(CONFIG.FEEL.HIT_STOP_MS);
          this.scene.cameras.main.shake(
            isHeavy ? CONFIG.FEEL.SHAKE_HEAVY_DURATION : CONFIG.FEEL.SHAKE_LIGHT_DURATION,
            isHeavy ? CONFIG.FEEL.SHAKE_HEAVY_INTENSITY : CONFIG.FEEL.SHAKE_LIGHT_INTENSITY
          );

          // Heavy boss poise: slight pushback without launching him high into the air
          const dir = this.sprite.x >= fromX ? 1 : -1;
          this.sprite.body.setVelocity(dir * 95, -25);
          this.sprite.setScale(1.24, 0.82);
          this.sprite.setTintFill(0xffffff);
          this.scene.time.delayedCall(80, () => {
            if (this.sprite && this.sprite.active && !this.isTelegraphing) {
              this.sprite.clearTint();
            }
          });

          this.scene.spawnHitParticles(this.sprite.x, this.sprite.y);

          if (this.stun >= this.maxStun) {
            this.enterStunState();
            return;
          }

          // Once the player lands 1-2 hits, the Rooster immediately retaliates!
          if (this.hitsTakenInWindow >= this.allowedWindowHits) {
            this.startCounterAttack(now, fromX);
          }
        } else {
          // Boss is actively attacking/telegraphing or player exceeded the 1-2 hit window:
          // Wing-Guard deflects 80% of the stun and prevents stun-locking!
          const reducedStun = Math.max(3, Math.round(stunAmount * 0.2));
          this.stun = Math.min(this.maxStun, this.stun + reducedStun);
          SFX.panHit(false);
          this.scene.spawnHitParticles(this.sprite.x, this.sprite.y, 4);
          this.sprite.setScale(1.12, 0.9);

          if (now - this.lastGuardNoticeTime > 700) {
            this.lastGuardNoticeTime = now;
            this.scene.showFloatingText(this.sprite.x, this.sprite.y - 65, '🛡 Крилатий блок!', '#ff9f1c');
          }

          if (this.stun >= this.maxStun) {
            this.enterStunState();
            return;
          }

          if (this.state === 'COOLDOWN') {
            this.startCounterAttack(now, fromX);
          }
        }
      }

      update(time, player) {
        if (!this.active || !this.updateBase(time)) return;

        const onFloor = this.sprite.body.blocked.down || this.sprite.body.touching.down;
        const distToPlayer = Math.abs(player.sprite.x - this.sprite.x);
        const dirToPlayer = player.sprite.x >= this.sprite.x ? 1 : -1;

        if (this.state === 'COOLDOWN') {
          // Actively stalk toward the player if they try to keep distance, instead of standing still
          if (distToPlayer > 125) {
            const stalkSpeed = CONFIG.ENEMY.BOSS_ROOSTER.STALK_SPEED * (this.stage === 2 ? 1.25 : 1);
            this.sprite.body.setVelocityX(dirToPlayer * stalkSpeed);
            this.sprite.setFlipX(dirToPlayer < 0);
          } else {
            this.sprite.body.setVelocityX(this.sprite.body.velocity.x * 0.8);
            this.sprite.setFlipX(dirToPlayer < 0);
          }

          if (time >= this.stateEndTime) {
            // Dynamic move selection based on distance and cycle
            const moves = distToPlayer < 160
              ? ['PECK_FLURRY', 'JUMP_SLAM', 'LUNGE', 'SUMMON']
              : ['LUNGE', 'JUMP_SLAM', 'PECK_FLURRY', 'SUMMON'];
            this.nextMove = moves[this.moveCycle % moves.length];
            this.moveCycle++;

            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.isCounterTelegraph = false;
            this.telegraphLabel.setText('!').setVisible(true);
            this.lungeDir = dirToPlayer;
            this.sprite.setFlipX(this.lungeDir < 0);
            this.sprite.setTint(0xffbe0b);
            this.sprite.setScale(1.18, 0.82);
            const telMs = CONFIG.ENEMY.BOSS_ROOSTER.TELEGRAPH_MS * (this.stage === 2 ? 0.82 : 1);
            this.stateEndTime = time + telMs;
            SFX.telegraph();
          }
        } else if (this.state === 'TELEGRAPH') {
          this.sprite.body.setVelocityX(this.sprite.body.velocity.x * 0.82);
          if (time >= this.stateEndTime) {
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            this.lungeDir = dirToPlayer;
            this.sprite.setFlipX(this.lungeDir < 0);

            if (this.nextMove === 'LUNGE') {
              this.state = 'LUNGE';
              this.chainedLungeCount = (this.stage === 2 || this.isCounterTelegraph) ? 1 : 0;
              this.sprite.setTint(0xff4d4d);
              this.stateEndTime = time + 640;
            } else if (this.nextMove === 'PECK_FLURRY') {
              this.state = 'PECK_FLURRY';
              this.peckBurstStep = 0;
              this.nextPeckBurstTime = time;
              this.sprite.setTint(0xff2a2a);
              this.stateEndTime = time + (this.stage === 2 ? 680 : 500);
            } else if (this.nextMove === 'JUMP_SLAM') {
              this.state = 'JUMP_SLAM';
              this.waitingForSlamLand = false;
              const horizJumpVel = Phaser.Math.Clamp((player.sprite.x - this.sprite.x) * 1.15, -340, 340);
              this.sprite.body.setVelocity(horizJumpVel, CONFIG.ENEMY.BOSS_ROOSTER.JUMP_VEL_Y);
              this.timeOutJump = time + 1500;
              this.scene.time.delayedCall(140, () => { this.waitingForSlamLand = true; });
            } else if (this.nextMove === 'SUMMON') {
              this.state = 'SUMMON';
              SFX.roosterCrow();
              this.scene.showFloatingText(this.sprite.x, this.sprite.y - 60, STRINGS.BOSS_SUMMON, '#ffd166');
              this.scene.summonBossChicks(this.sprite.x, this.stage);
              this.enterCooldownWindow(time, CONFIG.ENEMY.BOSS_ROOSTER.COOLDOWN_MS * 0.75);
            }
          }
        } else if (this.state === 'LUNGE') {
          const speed = CONFIG.ENEMY.BOSS_ROOSTER.LUNGE_SPEED * (this.stage === 2 ? 1.18 : 1);
          this.sprite.body.setVelocityX(this.lungeDir * speed);

          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            player.takeDamage(CONFIG.ENEMY.BOSS_ROOSTER.DAMAGE_LUNGE, this.sprite.x);
          }

          const hitArenaWall = (this.lungeDir < 0 && this.sprite.x < LEVEL_1_DATA.bossArenaStartX + 65) ||
                               (this.lungeDir > 0 && this.sprite.x > CONFIG.WORLD_WIDTH - 65);

          if (time >= this.stateEndTime || hitArenaWall) {
            if (this.chainedLungeCount > 0) {
              // Aggressive turnaround second lunge!
              this.chainedLungeCount--;
              this.lungeDir = dirToPlayer;
              this.sprite.setFlipX(this.lungeDir < 0);
              this.sprite.setScale(1.22, 0.8);
              this.stateEndTime = time + 520;
              SFX.telegraph();
            } else {
              const cd = CONFIG.ENEMY.BOSS_ROOSTER.COOLDOWN_MS * (this.stage === 2 ? 0.72 : 1);
              this.enterCooldownWindow(time, cd);
            }
          }
        } else if (this.state === 'PECK_FLURRY') {
          // Furious close-range peck & wing-spur combo rush
          if (time >= this.nextPeckBurstTime) {
            this.peckBurstStep++;
            this.nextPeckBurstTime = time + 230;
            this.lungeDir = dirToPlayer;
            this.sprite.setFlipX(this.lungeDir < 0);
            const peckSpeed = CONFIG.ENEMY.BOSS_ROOSTER.PECK_SPEED * (this.stage === 2 ? 1.16 : 1);
            this.sprite.body.setVelocityX(this.lungeDir * peckSpeed);
            if (onFloor && this.peckBurstStep === 1) {
              this.sprite.body.setVelocityY(-230);
            }
            this.sprite.setScale(1.28, 0.78);
            SFX.swing(this.peckBurstStep);
          }

          this.sprite.setAngle(Math.sin(time * 0.04) * 12 * this.lungeDir);

          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            player.takeDamage(CONFIG.ENEMY.BOSS_ROOSTER.DAMAGE_PECK, this.sprite.x);
          }

          if (time >= this.stateEndTime) {
            const cd = CONFIG.ENEMY.BOSS_ROOSTER.COOLDOWN_MS * (this.stage === 2 ? 0.7 : 0.9);
            this.enterCooldownWindow(time, cd);
          }
        } else if (this.state === 'JUMP_SLAM') {
          if ((this.waitingForSlamLand && onFloor) || time > this.timeOutJump) {
            // Landed! Create left & right shockwaves
            this.sprite.body.setVelocityX(0);
            this.sprite.setScale(1.32, 0.72);
            this.scene.cameras.main.shake(CONFIG.FEEL.SHAKE_HEAVY_DURATION, CONFIG.FEEL.SHAKE_HEAVY_INTENSITY);
            this.scene.spawnShockwaves(this.sprite.x, CONFIG.GROUND_Y - 14);
            const cd = CONFIG.ENEMY.BOSS_ROOSTER.COOLDOWN_MS * (this.stage === 2 ? 0.72 : 1);
            this.enterCooldownWindow(time, cd);
          }
        }
      }

      triggerFinisher(fromX) {
        if (this.stage === 1) {
          // First Finisher completed -> Transition to Stage 2!
          this.stage = 2;
          this.isStunned = false;
          this.stun = 0;
          this.barFill.setFillStyle(0xe63946);
          this.stunPrompt.setVisible(false);
          this.stars.forEach(s => s.setVisible(false));

          SFX.finisher();
          SFX.roosterCrow();
          this.scene.triggerHitStop(CONFIG.FEEL.FINISHER_HIT_STOP_MS);
          this.scene.cameras.main.shake(240, 0.015);
          this.scene.spawnHitParticles(this.sprite.x, this.sprite.y, 18);
          this.scene.spawnLoot(this.sprite.x, this.sprite.y);
          this.scene.showFloatingText(this.sprite.x, this.sprite.y - 65, STRINGS.BOSS_STAGE_2, '#ff4d4d');

          // Immediately leap into Stage 2 Jump Slam so player cannot stand still!
          this.state = 'JUMP_SLAM';
          this.waitingForSlamLand = false;
          this.sprite.body.setVelocity(0, -520);
          this.timeOutJump = this.scene.time.now + 1400;
          this.scene.time.delayedCall(140, () => { this.waitingForSlamLand = true; });
        } else {
          // Second Finisher completed -> Boss Pacified in a Giant Barrel & Victory!
          super.triggerFinisher(fromX);
          this.scene.time.delayedCall(1200, () => {
            this.scene.triggerVictory();
          });
        }
      }
    }

    /**
     * ============================================================================
     * 9B. ACT II («ЗЛИЙ ЛІС») UKRAINIAN FOREST MYTHOLOGY ENEMIES & BOSS
     * ============================================================================
     */

    /**
     * SUBCLASS D: Моховик-Щитоносець / Дубовий Страж (Oak-Shielded Forest Guardian)
     * - Completely INVULNERABLE to frontal melee attacks and frontal Galushkas!
     * - Can ONLY be damaged/stunned from behind by rolling through him with [Shift]!
     * - Has a deliberate turnaround delay (TURN_DELAY_MS = 470ms) when Omelko rolls behind him,
     *   giving a crisp tactical window for backstab combos!
     */
    class ShieldGuardianEnemy extends Enemy {
      constructor(scene, x, y, minX, maxX) {
        super(scene, x, y, 'enemy_shield_guardian', CONFIG.ENEMY.SHIELD_GUARDIAN.MAX_STUN);
        this.sprite.body.setSize(38, 52);
        this.sprite.body.setOffset(8, 6);
        this.minX = minX !== undefined ? minX : Math.max(100, x - 180);
        this.maxX = maxX !== undefined ? maxX : Math.min(CONFIG.WORLD_WIDTH - 100, x + 180);
        this.facing = -1; // 1 = right, -1 = left
        this.sprite.setFlipX(this.facing < 0);

        this.state = 'PATROL'; // PATROL, ADVANCE, TURN_DELAY, TELEGRAPH, SHIELD_BASH, COOLDOWN
        this.stateEndTime = 0;
        this.pendingFacing = -1;
        this.lastBlockHintTime = 0;
      }

      receiveStunHit(stunAmount, fromX, isHeavy = false) {
        if (this.isFinished) return;

        // Once stunned (100% bar), any hit triggers the Comical Finisher!
        if (this.isStunned) {
          this.triggerFinisher(fromX);
          return;
        }

        // Check if attack came from the FRONT (where the massive oak shield is held)
        const hitFromRight = fromX >= this.sprite.x;
        const isFrontalHit = (this.facing > 0 && hitFromRight) || (this.facing < 0 && !hitFromRight);

        if (isFrontalHit) {
          // 100% INVULNERABLE FROM THE FRONT!
          SFX.shieldBlock();
          this.scene.cameras.main.shake(90, 0.004);
          this.sprite.setScale(1.16, 0.9);
          this.sprite.setTint(0x94a3b8);
          this.scene.time.delayedCall(90, () => {
            if (this.sprite && this.sprite.active && !this.isTelegraphing) this.sprite.clearTint();
          });

          // Sparks on the front shield
          this.scene.spawnHitParticles(this.sprite.x + this.facing * 20, this.sprite.y, 5);

          // Push player slightly back when clanging against the oak shield
          if (this.scene.player && this.scene.player.sprite) {
            this.scene.player.sprite.body.setVelocityX(this.facing * 190);
          }

          const now = this.scene.time.now;
          if (now - this.lastBlockHintTime > 650) {
            this.lastBlockHintTime = now;
            this.scene.showFloatingText(this.sprite.x, this.sprite.y - 58, STRINGS.SHIELD_BLOCKED_HINT, '#ffd166');
          }
          return;
        }

        // Hit landed from BEHIND (Omelko rolled behind his shield with [Shift])!
        const backstabStun = Math.round(stunAmount * 1.35);
        this.scene.showFloatingText(this.sprite.x, this.sprite.y - 56, STRINGS.BACKSTAB_HIT, '#00f5d4');
        super.receiveStunHit(backstabStun, fromX, true);
      }

      update(time, player) {
        if (!this.updateBase(time)) return;

        const dist = Phaser.Math.Distance.Between(this.sprite.x, this.sprite.y, player.sprite.x, player.sprite.y);
        const horizDist = Math.abs(player.sprite.x - this.sprite.x);
        const vertDist = Math.abs(player.sprite.y - this.sprite.y);
        const dirToPlayer = player.sprite.x >= this.sprite.x ? 1 : -1;

        if (this.state === 'PATROL') {
          this.sprite.body.setVelocityX(this.facing * CONFIG.ENEMY.SHIELD_GUARDIAN.PATROL_SPEED);
          this.sprite.setFlipX(this.facing < 0);

          if (this.sprite.x >= this.maxX || this.sprite.body.blocked.right) {
            this.facing = -1;
            this.sprite.setFlipX(true);
          } else if (this.sprite.x <= this.minX || this.sprite.body.blocked.left) {
            this.facing = 1;
            this.sprite.setFlipX(false);
          }

          if (dist < CONFIG.ENEMY.SHIELD_GUARDIAN.AGGRO_RANGE && vertDist < 140) {
            this.state = 'ADVANCE';
          }
        } else if (this.state === 'ADVANCE') {
          if (dist > CONFIG.ENEMY.SHIELD_GUARDIAN.AGGRO_RANGE * 1.25 || vertDist > 180) {
            this.state = 'PATROL';
            return;
          }

          // If Omelko rolled behind the Shield Guardian, he cannot spin around instantly!
          // He enters a 470ms TURN_DELAY so the player can punish his exposed back!
          if (dirToPlayer !== this.facing && horizDist > 10) {
            this.state = 'TURN_DELAY';
            this.pendingFacing = dirToPlayer;
            this.sprite.body.setVelocityX(0);
            this.telegraphLabel.setText('?').setColor('#ffd166').setVisible(true);
            this.stateEndTime = time + CONFIG.ENEMY.SHIELD_GUARDIAN.TURN_DELAY_MS;
            return;
          }

          // Advance steadily with shield raised
          this.sprite.body.setVelocityX(this.facing * CONFIG.ENEMY.SHIELD_GUARDIAN.ADVANCE_SPEED);
          this.sprite.setFlipX(this.facing < 0);

          // Within bash range -> Telegraph heavy Shield Bash!
          if (horizDist < 125 && vertDist < 75) {
            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.sprite.body.setVelocityX(0);
            this.telegraphLabel.setText('!').setColor('#ff002b').setVisible(true);
            this.sprite.setTint(0xffbe0b);
            this.sprite.setScale(1.15, 0.85);
            this.stateEndTime = time + CONFIG.ENEMY.SHIELD_GUARDIAN.TELEGRAPH_MS;
            SFX.telegraph();
          }
        } else if (this.state === 'TURN_DELAY') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.telegraphLabel.setVisible(false);
            this.facing = this.pendingFacing;
            this.sprite.setFlipX(this.facing < 0);
            this.sprite.setScale(1.12, 0.9);
            // After turning around toward Omelko, if Omelko is still close, immediately telegraph a Shield Bash!
            if (horizDist < 135 && vertDist < 80) {
              this.state = 'TELEGRAPH';
              this.isTelegraphing = true;
              this.telegraphLabel.setText('!').setColor('#ff002b').setVisible(true);
              this.sprite.setTint(0xffbe0b);
              this.stateEndTime = time + CONFIG.ENEMY.SHIELD_GUARDIAN.TELEGRAPH_MS * 0.85;
              SFX.telegraph();
            } else {
              this.state = 'ADVANCE';
            }
          }
        } else if (this.state === 'TELEGRAPH') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.state = 'SHIELD_BASH';
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.setTint(0xff4d4d);
            this.stateEndTime = time + 480;
            SFX.swing(3, false);
          }
        } else if (this.state === 'SHIELD_BASH') {
          this.sprite.body.setVelocityX(this.facing * CONFIG.ENEMY.SHIELD_GUARDIAN.BASH_SPEED);

          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            player.takeDamage(CONFIG.ENEMY.SHIELD_GUARDIAN.DAMAGE_BASH, this.sprite.x);
            this.state = 'COOLDOWN';
            this.sprite.clearTint();
            this.sprite.body.setVelocityX(-this.facing * 90);
            this.stateEndTime = time + CONFIG.ENEMY.SHIELD_GUARDIAN.COOLDOWN_MS;
            return;
          }

          if (time >= this.stateEndTime) {
            this.state = 'COOLDOWN';
            this.sprite.clearTint();
            this.sprite.body.setVelocityX(0);
            this.stateEndTime = time + CONFIG.ENEMY.SHIELD_GUARDIAN.COOLDOWN_MS;
          }
        } else if (this.state === 'COOLDOWN') {
          this.sprite.body.setVelocityX(this.sprite.body.velocity.x * 0.8);
          if (time >= this.stateEndTime) {
            this.state = 'ADVANCE';
          }
        }
      }
    }

    /**
     * SUBCLASS E: Лісова Нявка (Eerie Woodland Spirit / Mavka)
     * - Hover-glides with a haunting sine wave motion, shrieks, and performs either a
     *   Phantom Swoop or fires a glowing Will-o'-Wisp ('willowisp' — вогник Блуду).
     */
    class NyavkaEnemy extends Enemy {
      constructor(scene, x, y, minX, maxX) {
        super(scene, x, y, 'enemy_nyavka', CONFIG.ENEMY.NYAVKA.MAX_STUN);
        this.minX = minX !== undefined ? minX : Math.max(100, x - 180);
        this.maxX = maxX !== undefined ? maxX : Math.min(CONFIG.WORLD_WIDTH - 100, x + 180);
        this.patrolDir = -1;
        this.state = 'FLOAT'; // FLOAT, TELEGRAPH, SWOOP, COOLDOWN
        this.stateEndTime = 0;
        this.swoopDir = -1;
        this.attackCycle = 0;
        this.sprite.setAlpha(0.92);
      }

      update(time, player) {
        if (!this.updateBase(time)) return;

        const dist = Phaser.Math.Distance.Between(this.sprite.x, this.sprite.y, player.sprite.x, player.sprite.y);
        const dirToPlayer = player.sprite.x >= this.sprite.x ? 1 : -1;

        if (this.state === 'FLOAT') {
          this.sprite.body.setVelocityX(this.patrolDir * CONFIG.ENEMY.NYAVKA.FLOAT_SPEED);
          this.sprite.setFlipX(this.patrolDir < 0);

          if (this.sprite.x >= this.maxX || this.sprite.body.blocked.right) this.patrolDir = -1;
          if (this.sprite.x <= this.minX || this.sprite.body.blocked.left) this.patrolDir = 1;

          // Eerie floating hop when touching floor
