          if ((this.sprite.body.blocked.down || this.sprite.body.touching.down) && Math.random() < 0.03) {
            this.sprite.body.setVelocityY(-260);
          }

          if (dist < CONFIG.ENEMY.NYAVKA.AGGRO_RANGE && Math.abs(player.sprite.y - this.sprite.y) < 210) {
            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.swoopDir = dirToPlayer;
            this.sprite.setFlipX(this.swoopDir < 0);
            this.sprite.body.setVelocityX(0);
            this.telegraphLabel.setText('!').setColor('#00f5d4').setVisible(true);
            this.sprite.setTint(0x80ed99);
            this.sprite.setScale(1.18, 0.84);
            this.stateEndTime = time + CONFIG.ENEMY.NYAVKA.TELEGRAPH_MS;
            SFX.nyavkaWail();
          }
        } else if (this.state === 'TELEGRAPH') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            this.attackCycle++;

            if (this.attackCycle % 2 === 0 && dist > 150) {
              // Fire ghostly Will-o'-Wisp orb toward Omelko
              this.scene.spawnWillOWisp(this.sprite.x, this.sprite.y - 8, player.sprite.x, player.sprite.y);
              this.state = 'COOLDOWN';
              this.stateEndTime = time + CONFIG.ENEMY.NYAVKA.COOLDOWN_MS;
            } else {
              // Fast Phantom Swoop!
              this.state = 'SWOOP';
              this.swoopDir = dirToPlayer;
              this.sprite.setFlipX(this.swoopDir < 0);
              this.sprite.setTint(0x00f5d4);
              if (player.sprite.y < this.sprite.y - 35 && (this.sprite.body.blocked.down || this.sprite.body.touching.down)) {
                this.sprite.body.setVelocityY(-490);
              }
              this.stateEndTime = time + 620;
            }
          }
        } else if (this.state === 'SWOOP') {
          this.sprite.body.setVelocityX(this.swoopDir * CONFIG.ENEMY.NYAVKA.SWOOP_SPEED);

          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            player.takeDamage(CONFIG.ENEMY.NYAVKA.DAMAGE, this.sprite.x);
            this.state = 'COOLDOWN';
            this.sprite.clearTint();
            this.sprite.body.setVelocityX(-this.swoopDir * 120);
            this.stateEndTime = time + CONFIG.ENEMY.NYAVKA.COOLDOWN_MS;
            return;
          }

          if (time >= this.stateEndTime) {
            this.state = 'COOLDOWN';
            this.sprite.clearTint();
            this.sprite.body.setVelocityX(0);
            this.stateEndTime = time + CONFIG.ENEMY.NYAVKA.COOLDOWN_MS;
          }
        } else if (this.state === 'COOLDOWN') {
          this.sprite.body.setVelocityX(this.sprite.body.velocity.x * 0.82);
          if (time >= this.stateEndTime) {
            this.state = 'FLOAT';
          }
        }
      }
    }

    /**
     * SUBCLASS F: Болотяник (Hulking Swamp Mire Demon)
     * - Hurls heavy toxic bog-sludge ('swamp_glob') at range, and performs a ground-shaking
     *   Mire Slam if Omelko gets close!
     */
    class BolotyanykEnemy extends Enemy {
      constructor(scene, x, y, minX, maxX) {
        super(scene, x, y, 'enemy_bolotyanyk', CONFIG.ENEMY.BOLOTYANYK.MAX_STUN);
        this.sprite.body.setSize(46, 50);
        this.sprite.body.setOffset(5, 6);
        this.minX = minX !== undefined ? minX : Math.max(100, x - 160);
        this.maxX = maxX !== undefined ? maxX : Math.min(CONFIG.WORLD_WIDTH - 100, x + 160);
        this.walkDir = -1;
        this.state = 'PATROL'; // PATROL, TELEGRAPH_THROW, TELEGRAPH_SLAM, COOLDOWN
        this.stateEndTime = 0;
        this.nextAttackTime = 0;
      }

      update(time, player) {
        if (!this.updateBase(time)) return;

        const dist = Phaser.Math.Distance.Between(this.sprite.x, this.sprite.y, player.sprite.x, player.sprite.y);
        const horizDist = Math.abs(player.sprite.x - this.sprite.x);
        const dirToPlayer = player.sprite.x >= this.sprite.x ? 1 : -1;

        if (this.state === 'PATROL') {
          this.sprite.body.setVelocityX(this.walkDir * CONFIG.ENEMY.BOLOTYANYK.WALK_SPEED);
          this.sprite.setFlipX(this.walkDir < 0);

          if (this.sprite.x >= this.maxX || this.sprite.body.blocked.right) this.walkDir = -1;
          if (this.sprite.x <= this.minX || this.sprite.body.blocked.left) this.walkDir = 1;

          if (dist < CONFIG.ENEMY.BOLOTYANYK.AGGRO_RANGE && time >= this.nextAttackTime) {
            this.isTelegraphing = true;
            this.sprite.body.setVelocityX(0);
            this.sprite.setFlipX(dirToPlayer < 0);
            this.telegraphLabel.setText('!').setColor('#80ed99').setVisible(true);
            this.sprite.setTint(0x80ed99);
            this.sprite.setScale(1.22, 0.8);
            this.stateEndTime = time + CONFIG.ENEMY.BOLOTYANYK.TELEGRAPH_MS;
            this.state = horizDist < CONFIG.ENEMY.BOLOTYANYK.SLAM_RANGE ? 'TELEGRAPH_SLAM' : 'TELEGRAPH_THROW';
            SFX.telegraph();
          }
        } else if (this.state === 'TELEGRAPH_THROW') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            this.sprite.setScale(0.85, 1.22);
            this.scene.spawnSwampGlob(this.sprite.x, this.sprite.y - 12, player.sprite.x, player.sprite.y);
            this.state = 'COOLDOWN';
            this.stateEndTime = time + 400;
            this.nextAttackTime = time + CONFIG.ENEMY.BOLOTYANYK.COOLDOWN_MS;
          }
        } else if (this.state === 'TELEGRAPH_SLAM') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            this.sprite.setScale(1.34, 0.72);
            this.scene.cameras.main.shake(150, 0.008);
            this.scene.spawnHitParticles(this.sprite.x, this.sprite.y + 18, 8);
            if (horizDist < CONFIG.ENEMY.BOLOTYANYK.SLAM_RANGE + 25 && Math.abs(player.sprite.y - this.sprite.y) < 75) {
              player.takeDamage(CONFIG.ENEMY.BOLOTYANYK.DAMAGE_SLAM, this.sprite.x);
            }
            // Also hurl two short mire globs left & right on slam
            this.scene.spawnSwampGlob(this.sprite.x, this.sprite.y - 8, this.sprite.x - 160, this.sprite.y);
            this.scene.spawnSwampGlob(this.sprite.x, this.sprite.y - 8, this.sprite.x + 160, this.sprite.y);
            this.state = 'COOLDOWN';
            this.stateEndTime = time + 480;
            this.nextAttackTime = time + CONFIG.ENEMY.BOLOTYANYK.COOLDOWN_MS;
          }
        } else if (this.state === 'COOLDOWN') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.state = 'PATROL';
          }
        }
      }
    }

    /**
     * ============================================================================
     * 9C. BOSS OF ACT II («ЗЛИЙ ЛІС»): ПРАДАВНІЙ ЛІСОВИК «ЧОРНОБОР»
     * - Towering Master of the Evil Forest.
     * - Combines a strict 1-2 hit window with a Frontal Bark-Shield Stance:
     *   during Bark-Shield Stance (or frontal spam), Omelko MUST Roll [Shift] behind him!
     * - Moves: ROOT_CHARGE, CLAW_FLURRY, THORN_SLAM (root shockwaves), SUMMON_FOREST.
     * ============================================================================
     */
    class DarkLisovykBoss extends Enemy {
      constructor(scene, x, y) {
        super(scene, x, y, 'boss_lisovyk', CONFIG.ENEMY.BOSS_LISOVYK.MAX_STUN);
        this.sprite.body.setSize(72, 86);
        this.sprite.body.setOffset(12, 8);

        this.stage = 1; // 1 or 2
        this.active = false;
        this.facing = -1;
        this.sprite.setFlipX(true);

        this.state = 'IDLE'; // IDLE, COOLDOWN, TELEGRAPH, ROOT_CHARGE, CLAW_FLURRY, THORN_SLAM, SUMMON_FOREST
        this.nextMove = 'ROOT_CHARGE';
        this.moveCycle = 0;
        this.stateEndTime = 0;
        this.waitingForSlamLand = false;

        this.hitsTakenInWindow = 0;
        this.allowedWindowHits = 2;
        this.barkShieldActive = false; // When true, frontal hits are 100% blocked — must roll behind!
        this.chainedChargeCount = 0;
        this.clawBurstStep = 0;
        this.nextClawBurstTime = 0;
        this.lastGuardNoticeTime = 0;
      }

      activate() {
        if (this.active) return;
        this.active = true;
        this.enterCooldownWindow(this.scene.time.now, 680);
        SFX.lisovykRoar();
      }

      enterCooldownWindow(time, durationMs) {
        this.state = 'COOLDOWN';
        this.isTelegraphing = false;
        this.telegraphLabel.setVisible(false);
        this.sprite.setAngle(0);
        this.sprite.clearTint();
        this.stateEndTime = time + durationMs;
        this.hitsTakenInWindow = 0;
        this.allowedWindowHits = (this.stage === 2 && Math.random() < 0.5) ? 1 : Phaser.Math.Between(1, 2);
        // Every second cooldown window (or in Stage 2), Chornobor raises his frontal Bark Shield so Omelko must roll behind him!
        this.barkShieldActive = (this.moveCycle % 2 === 1) || (this.stage === 2 && Math.random() < 0.6);
      }

      startCounterAttack(time, targetX) {
        if (this.isStunned || this.isFinished) return;

        this.state = 'TELEGRAPH';
        this.isTelegraphing = true;
        this.telegraphLabel.setText('⚡!').setColor('#ff002b').setVisible(true);

        this.facing = targetX >= this.sprite.x ? 1 : -1;
        this.sprite.setFlipX(this.facing < 0);
        this.sprite.setTint(0xd90429);
        this.sprite.setScale(1.25, 0.78);
        this.sprite.body.setVelocity(-this.facing * 115, -170);

        const dist = Math.abs(targetX - this.sprite.x);
        if (dist < 185) {
          this.nextMove = Math.random() < 0.7 ? 'CLAW_FLURRY' : 'THORN_SLAM';
        } else {
          this.nextMove = Math.random() < 0.65 ? 'ROOT_CHARGE' : 'THORN_SLAM';
        }

        const counterTelMs = CONFIG.ENEMY.BOSS_LISOVYK.COUNTER_TELEGRAPH_MS * (this.stage === 2 ? 0.84 : 1);
        this.stateEndTime = time + counterTelMs;
        SFX.lisovykRoar();

        if (time - this.lastGuardNoticeTime > 650) {
          this.lastGuardNoticeTime = time;
          this.scene.showFloatingText(this.sprite.x, this.sprite.y - 70, '⚡ ГНІВ ЛІСОВИКА!', '#ff4d4d');
        }
      }

      receiveStunHit(stunAmount, fromX, isHeavy = false) {
        if (this.isFinished) return;

        if (this.isStunned) {
          this.triggerFinisher(fromX);
          return;
        }

        const now = this.scene.time.now;
        const hitFromRight = fromX >= this.sprite.x;
        const isFrontalHit = (this.facing > 0 && hitFromRight) || (this.facing < 0 && !hitFromRight);

        // If Bark Shield is active and player attacks from the front, block 100% and prompt roll behind!
        if (this.barkShieldActive && isFrontalHit) {
          SFX.shieldBlock();
          this.scene.spawnHitParticles(this.sprite.x + this.facing * 26, this.sprite.y, 5);
          this.sprite.setScale(1.15, 0.9);
          if (now - this.lastGuardNoticeTime > 650) {
            this.lastGuardNoticeTime = now;
            this.scene.showFloatingText(this.sprite.x, this.sprite.y - 68, '🛡 Коровий щит! Перекотись за спину [Shift]!', '#00f5d4');
          }
          return;
        }

        const inOpenWindow = (this.state === 'COOLDOWN') && (this.hitsTakenInWindow < this.allowedWindowHits);

        if (inOpenWindow || !isFrontalHit) {
          this.hitsTakenInWindow++;
          const bonusMult = !isFrontalHit ? 1.25 : 1;
          this.stun = Math.min(this.maxStun, this.stun + Math.round(stunAmount * bonusMult));
          SFX.panHit(isHeavy || !isFrontalHit);

          if (!isFrontalHit) {
            this.scene.showFloatingText(this.sprite.x, this.sprite.y - 68, STRINGS.BACKSTAB_HIT, '#00f5d4');
          }

          this.scene.triggerHitStop(CONFIG.FEEL.HIT_STOP_MS);
          this.scene.cameras.main.shake(
            isHeavy ? CONFIG.FEEL.SHAKE_HEAVY_DURATION : CONFIG.FEEL.SHAKE_LIGHT_DURATION,
            isHeavy ? CONFIG.FEEL.SHAKE_HEAVY_INTENSITY : CONFIG.FEEL.SHAKE_LIGHT_INTENSITY
          );

          const dir = this.sprite.x >= fromX ? 1 : -1;
          this.sprite.body.setVelocity(dir * 90, -25);
          this.sprite.setScale(1.24, 0.82);
          this.sprite.setTintFill(0xffffff);
          this.scene.time.delayedCall(80, () => {
            if (this.sprite && this.sprite.active && !this.isTelegraphing) this.sprite.clearTint();
          });

          this.scene.spawnHitParticles(this.sprite.x, this.sprite.y);

          if (this.stun >= this.maxStun) {
            this.enterStunState();
            return;
          }

          if (this.hitsTakenInWindow >= this.allowedWindowHits) {
            this.startCounterAttack(now, fromX);
          }
        } else {
          // Deflected by ancient bark armor outside punish window
          const reducedStun = Math.max(3, Math.round(stunAmount * 0.18));
          this.stun = Math.min(this.maxStun, this.stun + reducedStun);
          SFX.shieldBlock();
          this.scene.spawnHitParticles(this.sprite.x, this.sprite.y, 4);
          if (now - this.lastGuardNoticeTime > 700) {
            this.lastGuardNoticeTime = now;
            this.scene.showFloatingText(this.sprite.x, this.sprite.y - 68, '🛡 Броня Пралісу! Заходь зі спини [Shift]!', '#ff9f1c');
          }
          if (this.stun >= this.maxStun) {
            this.enterStunState();
            return;
          }
          if (this.state === 'COOLDOWN') {
            this.startCounterAttack(now, fromX);
          }
        }
      }

      update(time, player) {
        if (!this.active || !this.updateBase(time)) return;

        const onFloor = this.sprite.body.blocked.down || this.sprite.body.touching.down;
        const distToPlayer = Math.abs(player.sprite.x - this.sprite.x);
        const dirToPlayer = player.sprite.x >= this.sprite.x ? 1 : -1;

        if (this.state === 'COOLDOWN') {
          // Turn toward player with slight delay if player rolled behind him
          if (dirToPlayer !== this.facing) {
            if (!this.turnAroundAt) {
              this.turnAroundAt = time + 440;
            } else if (time >= this.turnAroundAt) {
              this.facing = dirToPlayer;
              this.sprite.setFlipX(this.facing < 0);
              this.turnAroundAt = 0;
            }
          } else {
            this.turnAroundAt = 0;
          }

          if (distToPlayer > 130 && dirToPlayer === this.facing) {
            const stalkSpeed = CONFIG.ENEMY.BOSS_LISOVYK.STALK_SPEED * (this.stage === 2 ? 1.25 : 1);
            this.sprite.body.setVelocityX(this.facing * stalkSpeed);
          } else {
            this.sprite.body.setVelocityX(this.sprite.body.velocity.x * 0.8);
          }

          if (time >= this.stateEndTime) {
            const moves = distToPlayer < 170
              ? ['CLAW_FLURRY', 'THORN_SLAM', 'ROOT_CHARGE', 'SUMMON_FOREST']
              : ['ROOT_CHARGE', 'THORN_SLAM', 'CLAW_FLURRY', 'SUMMON_FOREST'];
            this.nextMove = moves[this.moveCycle % moves.length];
            this.moveCycle++;

            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.facing = dirToPlayer;
            this.sprite.setFlipX(this.facing < 0);
            this.telegraphLabel.setText('!').setColor('#ff002b').setVisible(true);
            this.sprite.setTint(0x00f5d4);
            this.sprite.setScale(1.2, 0.82);
            const telMs = CONFIG.ENEMY.BOSS_LISOVYK.TELEGRAPH_MS * (this.stage === 2 ? 0.82 : 1);
            this.stateEndTime = time + telMs;
            SFX.telegraph();
          }
        } else if (this.state === 'TELEGRAPH') {
          this.sprite.body.setVelocityX(this.sprite.body.velocity.x * 0.82);
          if (time >= this.stateEndTime) {
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            this.facing = dirToPlayer;
            this.sprite.setFlipX(this.facing < 0);

            if (this.nextMove === 'ROOT_CHARGE') {
              this.state = 'ROOT_CHARGE';
              this.chainedChargeCount = this.stage === 2 ? 1 : 0;
              this.sprite.setTint(0xd90429);
              this.stateEndTime = time + 650;
            } else if (this.nextMove === 'CLAW_FLURRY') {
              this.state = 'CLAW_FLURRY';
              this.clawBurstStep = 0;
              this.nextClawBurstTime = time;
              this.sprite.setTint(0xff002b);
              this.stateEndTime = time + (this.stage === 2 ? 720 : 540);
            } else if (this.nextMove === 'THORN_SLAM') {
              this.state = 'THORN_SLAM';
              this.waitingForSlamLand = false;
              const horizJumpVel = Phaser.Math.Clamp((player.sprite.x - this.sprite.x) * 1.2, -360, 360);
              this.sprite.body.setVelocity(horizJumpVel, CONFIG.ENEMY.BOSS_LISOVYK.JUMP_VEL_Y);
              this.timeOutJump = time + 1500;
              this.scene.time.delayedCall(140, () => { this.waitingForSlamLand = true; });
            } else if (this.nextMove === 'SUMMON_FOREST') {
              this.state = 'SUMMON_FOREST';
              SFX.lisovykRoar();
              this.scene.showFloatingText(this.sprite.x, this.sprite.y - 65, STRINGS.BOSS_LISOVYK_SUMMON, '#00f5d4');
              this.scene.summonLisovykMinions(this.sprite.x, this.stage);
              this.enterCooldownWindow(time, CONFIG.ENEMY.BOSS_LISOVYK.COOLDOWN_MS * 0.78);
            }
          }
        } else if (this.state === 'ROOT_CHARGE') {
          const speed = CONFIG.ENEMY.BOSS_LISOVYK.CHARGE_SPEED * (this.stage === 2 ? 1.18 : 1);
          this.sprite.body.setVelocityX(this.facing * speed);

          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            player.takeDamage(CONFIG.ENEMY.BOSS_LISOVYK.DAMAGE_CHARGE, this.sprite.x);
          }

          const arenaMinX = (this.scene.levelData ? this.scene.levelData.bossArenaStartX : 3880) + 65;
          const hitArenaWall = (this.facing < 0 && this.sprite.x < arenaMinX) ||
                               (this.facing > 0 && this.sprite.x > CONFIG.WORLD_WIDTH - 65);

          if (time >= this.stateEndTime || hitArenaWall) {
            if (this.chainedChargeCount > 0) {
              this.chainedChargeCount--;
              this.facing = dirToPlayer;
              this.sprite.setFlipX(this.facing < 0);
              this.sprite.setScale(1.24, 0.8);
              this.stateEndTime = time + 530;
              SFX.telegraph();
            } else {
              const cd = CONFIG.ENEMY.BOSS_LISOVYK.COOLDOWN_MS * (this.stage === 2 ? 0.72 : 1);
              this.enterCooldownWindow(time, cd);
            }
          }
        } else if (this.state === 'CLAW_FLURRY') {
          if (time >= this.nextClawBurstTime) {
            this.clawBurstStep++;
            this.nextClawBurstTime = time + 220;
            this.facing = dirToPlayer;
            this.sprite.setFlipX(this.facing < 0);
            const clawSpeed = CONFIG.ENEMY.BOSS_LISOVYK.CLAW_SPEED * (this.stage === 2 ? 1.16 : 1);
            this.sprite.body.setVelocityX(this.facing * clawSpeed);
            if (onFloor && this.clawBurstStep === 1) {
              this.sprite.body.setVelocityY(-240);
            }
            this.sprite.setScale(1.3, 0.78);
            SFX.swing(this.clawBurstStep, true);
          }

          this.sprite.setAngle(Math.sin(time * 0.045) * 12 * this.facing);

          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            player.takeDamage(CONFIG.ENEMY.BOSS_LISOVYK.DAMAGE_CLAW, this.sprite.x);
          }

          if (time >= this.stateEndTime) {
            const cd = CONFIG.ENEMY.BOSS_LISOVYK.COOLDOWN_MS * (this.stage === 2 ? 0.7 : 0.9);
            this.enterCooldownWindow(time, cd);
          }
        } else if (this.state === 'THORN_SLAM') {
          if ((this.waitingForSlamLand && onFloor) || time > this.timeOutJump) {
            this.sprite.body.setVelocityX(0);
            this.sprite.setScale(1.35, 0.72);
            this.scene.cameras.main.shake(CONFIG.FEEL.SHAKE_HEAVY_DURATION, CONFIG.FEEL.SHAKE_HEAVY_INTENSITY);
            this.scene.spawnRootWaves(this.sprite.x, CONFIG.GROUND_Y - 14);
            const cd = CONFIG.ENEMY.BOSS_LISOVYK.COOLDOWN_MS * (this.stage === 2 ? 0.72 : 1);
            this.enterCooldownWindow(time, cd);
          }
        }
      }

      triggerFinisher(fromX) {
        if (this.stage === 1) {
          this.stage = 2;
          this.isStunned = false;
          this.stun = 0;
          this.barFill.setFillStyle(0xe63946);
          this.stunPrompt.setVisible(false);
          this.stars.forEach(s => s.setVisible(false));

          SFX.finisher();
          SFX.lisovykRoar();
          this.scene.triggerHitStop(CONFIG.FEEL.FINISHER_HIT_STOP_MS);
          this.scene.cameras.main.shake(260, 0.016);
          this.scene.spawnHitParticles(this.sprite.x, this.sprite.y, 20);
          this.scene.spawnLoot(this.sprite.x, this.sprite.y);
          this.scene.showFloatingText(this.sprite.x, this.sprite.y - 70, STRINGS.BOSS_LISOVYK_STAGE_2, '#00f5d4');

          // Leap into Stage 2 Thorn Slam!
          this.state = 'THORN_SLAM';
          this.waitingForSlamLand = false;
          this.sprite.body.setVelocity(0, -540);
          this.timeOutJump = this.scene.time.now + 1400;
          this.scene.time.delayedCall(140, () => { this.waitingForSlamLand = true; });
        } else {
          super.triggerFinisher(fromX);
          this.scene.time.delayedCall(1200, () => {
            this.scene.triggerVictory();
          });
        }
      }
    }

    /**
     * ============================================================================
     * 9G. DNIPRO RUSALKA ("ДНІПРОВА РУСАЛКА-ЛОСКОТАРКА") — ACT III WATER AMBUSH
     * Swims below cloud gaps, telegraphs with a glowing lily wreath & song, then
     * leaps high out of the Dnipro to grab Omelko and drag him into the river!
     * Omelko can dodge with [Shift] or jump, or break free with [Shift]/[Space]/[D].
     * ============================================================================
     */
    class RusalkaEnemy extends Enemy {
      constructor(scene, x, y, minX, maxX) {
        super(scene, x, CONFIG.GROUND_Y + 14, 'enemy_rusalka', CONFIG.ENEMY.RUSALKA.MAX_STUN, CONFIG.ENEMY.RUSALKA.STUN_MS);
        this.minX = minX;
        this.maxX = maxX;
        this.patrolDir = 1;
        this.state = 'SWIM'; // SWIM -> TELEGRAPH -> LEAP -> GRABBING
        this.stateEndTime = scene.time.now + Phaser.Math.Between(900, 1700);
        this.sprite.body.setAllowGravity(false);
        this.sprite.body.setSize(30, 44);
        this.sprite.setAlpha(0.75);

        // Floating water-lily wreath marker on the water surface so Omelko sees where she lurks
        this.surfaceWreath = scene.add.image(x, CONFIG.GROUND_Y + 4, 'rusalka_wreath').setDepth(28);
      }

      update(time, player) {
        if (this.isFinished) {
          if (this.scene.grabbedByRusalka === this) {
            this.scene.grabbedByRusalka = null;
          }
          if (this.surfaceWreath && this.surfaceWreath.active) this.surfaceWreath.setVisible(false);
          return;
        }

        // Keep surface wreath synced with her X position
        if (this.surfaceWreath && this.surfaceWreath.active) {
          this.surfaceWreath.setPosition(this.sprite.x, CONFIG.GROUND_Y + 4 + Math.sin(time * 0.008) * 3);
        }

        if (this.isStunned) {
          if (this.scene.grabbedByRusalka === this) {
            this.scene.grabbedByRusalka = null;
          }
          this.sprite.body.setAllowGravity(false);
          this.sprite.body.setVelocity(0, Math.sin(time * 0.01) * 15);
          this.updateBase(time);
          return;
        }

        if (!this.updateBase(time)) return;

        const distX = Math.abs(player.sprite.x - this.sprite.x);
        const dirToPlayer = player.sprite.x >= this.sprite.x ? 1 : -1;

        if (this.state === 'SWIM') {
          this.sprite.body.setAllowGravity(false);
          this.sprite.y = Phaser.Math.Linear(this.sprite.y, CONFIG.GROUND_Y + 14, 0.15);
          this.sprite.setAlpha(0.72);
          this.sprite.body.setVelocityY(0);

          if (this.sprite.x <= this.minX) this.patrolDir = 1;
          if (this.sprite.x >= this.maxX) this.patrolDir = -1;

          // Track closer toward Omelko when he jumps across clouds above her patrol zone
          if (player.sprite.x >= this.minX - 60 && player.sprite.x <= this.maxX + 60) {
            this.patrolDir = dirToPlayer;
          }
          this.sprite.body.setVelocityX(this.patrolDir * CONFIG.ENEMY.RUSALKA.SWIM_SPEED);
          this.sprite.setFlipX(this.patrolDir < 0);

          if (time >= this.stateEndTime && distX < 185 && player.sprite.y < CONFIG.GROUND_Y - 10) {
            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.stateEndTime = time + CONFIG.ENEMY.RUSALKA.TELEGRAPH_MS;
            this.sprite.body.setVelocityX(0);
            this.telegraphLabel.setText('🧜‍♀️!').setColor('#00f5d4').setVisible(true);
            this.sprite.setTint(0x48cae4);
            this.sprite.setAlpha(1);
            if (this.surfaceWreath) this.surfaceWreath.setScale(1.35);
            SFX.rusalkaSong();
            this.scene.spawnWaterSplash(this.sprite.x, CONFIG.GROUND_Y, 6);
            if (distX < 145) {
              this.scene.showFloatingText(this.sprite.x, CONFIG.GROUND_Y - 36, STRINGS.RUSALKA_WARN, '#48cae4');
            }
          }
        } else if (this.state === 'TELEGRAPH') {
          this.sprite.body.setVelocityX(0);
          this.sprite.y = CONFIG.GROUND_Y + 4 + Math.sin(time * 0.05) * 3;
          if (time >= this.stateEndTime) {
            this.state = 'LEAP';
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            if (this.surfaceWreath) this.surfaceWreath.setScale(1);

            this.sprite.body.setAllowGravity(true);
            const jumpVx = Phaser.Math.Clamp((player.sprite.x - this.sprite.x) * 1.35, -170, 170);
            this.sprite.body.setVelocity(jumpVx, CONFIG.ENEMY.RUSALKA.LEAP_VEL_Y);
            this.sprite.setFlipX(jumpVx < 0);
            this.stateEndTime = time + 1450;
            SFX.waterSplash();
            this.scene.spawnWaterSplash(this.sprite.x, CONFIG.GROUND_Y, 10);
          }
        } else if (this.state === 'LEAP') {
          // Check if she grabs Omelko mid-air (unless Omelko dodges with Shift roll or is invulnerable!)
          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            if (player.isRolling || time < player.invulnUntil) {
              // Omelko dodged her grab! Open counter-attack window and stun her briefly
              player.counterWindowEndTime = time + CONFIG.PLAYER.COUNTER_WINDOW_MS + 250;
              this.scene.showFloatingText(player.sprite.x, player.sprite.y - 45, STRINGS.RUSALKA_DODGED, '#00f5d4');
              this.receiveStunHit(28, player.sprite.x, false);
              this.state = 'SWIM';
              this.stateEndTime = time + CONFIG.ENEMY.RUSALKA.COOLDOWN_MS;
              return;
            } else if (!this.scene.grabbedByRusalka) {
              // Grab Omelko and try to pull him down into the Dnipro!
              this.state = 'GRABBING';
              this.grabStartTime = time;
              this.grabReleaseTime = time + 900;
              this.scene.grabbedByRusalka = this;
              SFX.rusalkaSong();
              this.scene.showFloatingText(player.sprite.x, player.sprite.y - 52, STRINGS.RUSALKA_GRABBED, '#ff758f');
              player.takeDamage(CONFIG.ENEMY.RUSALKA.DAMAGE, this.sprite.x);
              return;
            }
          }

          // Return to water after her arc finishes
          if ((this.sprite.body.velocity.y > 0 && this.sprite.y >= CONFIG.GROUND_Y + 10) || time >= this.stateEndTime) {
            this.sprite.body.setAllowGravity(false);
            this.sprite.body.setVelocity(0, 0);
            this.sprite.y = CONFIG.GROUND_Y + 14;
            this.state = 'SWIM';
            this.stateEndTime = time + CONFIG.ENEMY.RUSALKA.COOLDOWN_MS;
            this.scene.spawnWaterSplash(this.sprite.x, CONFIG.GROUND_Y, 7);
          }
        } else if (this.state === 'GRABBING') {
          // Safely check player keys (space, upArrow, rollShift, attackD, throwS) and touch controls
          const k = player.keys || {};
          const touch = (player.scene && player.scene.ui && player.scene.ui.touchState) ? player.scene.ui.touchState : {};
          const gracePassed = time >= (this.grabStartTime || 0) + 120;

          const brokeFree = player.isRolling ||
            Boolean(k.rollShift && Phaser.Input.Keyboard.JustDown(k.rollShift)) ||
            Boolean(k.space && Phaser.Input.Keyboard.JustDown(k.space)) ||
            Boolean(k.upArrow && Phaser.Input.Keyboard.JustDown(k.upArrow)) ||
            Boolean(k.attackD && Phaser.Input.Keyboard.JustDown(k.attackD)) ||
            Boolean(k.throwS && Phaser.Input.Keyboard.JustDown(k.throwS)) ||
            (gracePassed && (
              Boolean(k.rollShift && k.rollShift.isDown) ||
              Boolean(k.space && k.space.isDown) ||
              Boolean(k.upArrow && k.upArrow.isDown) ||
              Boolean(k.attackD && k.attackD.isDown) ||
              Boolean(touch.jump || touch.roll || touch.attack)
            ));

          if (brokeFree || time >= this.grabReleaseTime || this.isStunned) {
            if (this.scene.grabbedByRusalka === this) {
              this.scene.grabbedByRusalka = null;
            }
            if (brokeFree) {
              player.sprite.body.setVelocityY(-460);
              player.canDoubleJump = true;
              player.invulnUntil = time + 700;
              SFX.jump(true);
              this.scene.showFloatingText(player.sprite.x, player.sprite.y - 48, STRINGS.RUSALKA_ESCAPED, '#ffd166');
              this.receiveStunHit(34, player.sprite.x, true);
            }
            this.sprite.body.setAllowGravity(false);
            this.sprite.body.setVelocity(0, 0);
            this.sprite.y = CONFIG.GROUND_Y + 14;
            this.state = 'SWIM';
            this.stateEndTime = time + CONFIG.ENEMY.RUSALKA.COOLDOWN_MS + 500;
            return;
          }

          // Pull Omelko gently downward toward the river while clinging to him
          this.sprite.setPosition(player.sprite.x + (this.patrolDir * 10), player.sprite.y + 8);
          this.sprite.body.setVelocity(0, 0);
          player.sprite.body.setVelocityX(player.sprite.body.velocity.x * 0.55);
          player.sprite.body.setVelocityY(CONFIG.ENEMY.RUSALKA.PULL_SPEED_Y);
        }
      }

      triggerFinisher(fromX) {
        if (this.scene.grabbedByRusalka === this) {
          this.scene.grabbedByRusalka = null;
        }
        if (this.surfaceWreath && this.surfaceWreath.active) {
          this.surfaceWreath.destroy();
        }
        super.triggerFinisher(fromX);
      }
    }

    /**
     * ============================================================================
     * 9H. VODYANYK ("ВОДЯНИК ХМАРНИЙ") — ACT III CLOUD PLATFORM CASTER
     * Patrols cloud platforms and hurls spinning whirlpool water orbs!
     * ============================================================================
     */
    class VodyanykEnemy extends Enemy {
      constructor(scene, x, y, minX, maxX) {
        super(scene, x, y, 'enemy_vodyanyk', CONFIG.ENEMY.VODYANYK.MAX_STUN, CONFIG.ENEMY.VODYANYK.STUN_MS);
        this.minX = minX;
        this.maxX = maxX;
        this.patrolDir = 1;
        this.state = 'PATROL';
        this.stateEndTime = scene.time.now + Phaser.Math.Between(900, 1700);
        this.sprite.body.setSize(32, 46);
      }

      update(time, player) {
        if (!this.updateBase(time)) return;

        // Keep Vodyanyk from falling into the water if knocked off his cloud
        if (this.sprite.y > CONFIG.GROUND_Y - 15) {
          this.sprite.y = CONFIG.GROUND_Y - 140;
          this.sprite.body.setVelocityY(-180);
        }

        const dist = Math.abs(player.sprite.x - this.sprite.x);
        const dirToPlayer = player.sprite.x >= this.sprite.x ? 1 : -1;

        if (this.state === 'PATROL') {
          if (this.sprite.x <= this.minX) this.patrolDir = 1;
          if (this.sprite.x >= this.maxX) this.patrolDir = -1;
          this.sprite.body.setVelocityX(this.patrolDir * CONFIG.ENEMY.VODYANYK.PATROL_SPEED);
          this.sprite.setFlipX(this.patrolDir < 0);

          if (dist < 420 && time > this.stateEndTime) {
            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.sprite.body.setVelocityX(0);
            this.sprite.setFlipX(dirToPlayer < 0);
            this.telegraphLabel.setText('🌊!').setColor('#48cae4').setVisible(true);
            this.sprite.setTint(0x48cae4);
            this.stateEndTime = time + CONFIG.ENEMY.VODYANYK.TELEGRAPH_MS;
            SFX.telegraph();
          }
        } else if (this.state === 'TELEGRAPH') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            this.scene.spawnWaterOrb(this.sprite.x, this.sprite.y - 10, player.sprite.x, player.sprite.y - 10);
            this.state = 'PATROL';
            this.stateEndTime = time + CONFIG.ENEMY.VODYANYK.COOLDOWN_MS;
          }
        }
      }
    }

    /**
     * ============================================================================
     * 9I. POTERCHA ("ПОТЕРЧА РІЧКОВЕ З КАганцем") — ACT III SKY FLYER
     * Hovers above cloud gaps with a glowing marsh lantern and swoops at Omelko.
     * ============================================================================
     */
    class PoterchaEnemy extends Enemy {
      constructor(scene, x, y, minX, maxX) {
        super(scene, x, y, 'enemy_potercha', CONFIG.ENEMY.POTERCHA.MAX_STUN, CONFIG.ENEMY.POTERCHA.STUN_MS);
        this.baseY = y;
        this.minX = minX;
        this.maxX = maxX;
        this.patrolDir = -1;
        this.state = 'HOVER';
        this.stateEndTime = scene.time.now + 1100;
        this.sprite.body.setAllowGravity(false);
        this.sprite.body.setSize(30, 36);
      }

      update(time, player) {
        if (!this.updateBase(time)) return;

        const dist = Phaser.Math.Distance.Between(this.sprite.x, this.sprite.y, player.sprite.x, player.sprite.y);
        const dirToPlayer = player.sprite.x >= this.sprite.x ? 1 : -1;

        if (this.state === 'HOVER') {
          if (this.sprite.x <= this.minX) this.patrolDir = 1;
          if (this.sprite.x >= this.maxX) this.patrolDir = -1;
          this.sprite.body.setVelocityX(this.patrolDir * CONFIG.ENEMY.POTERCHA.FLY_SPEED);
          this.sprite.body.setVelocityY(Math.cos(time * 0.007) * 38);
          this.sprite.setFlipX(this.patrolDir < 0);

          if (dist < 310 && time >= this.stateEndTime) {
            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.swoopDir = dirToPlayer;
            this.sprite.body.setVelocity(0, 0);
            this.sprite.setFlipX(this.swoopDir < 0);
            this.telegraphLabel.setText('!').setColor('#ffea00').setVisible(true);
            this.sprite.setTint(0xffea00);
            this.stateEndTime = time + CONFIG.ENEMY.POTERCHA.TELEGRAPH_MS;
            SFX.telegraph();
          }
        } else if (this.state === 'TELEGRAPH') {
          if (time >= this.stateEndTime) {
            this.state = 'SWOOP';
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            const angle = Phaser.Math.Angle.Between(this.sprite.x, this.sprite.y, player.sprite.x, player.sprite.y);
            this.sprite.body.setVelocity(
              Math.cos(angle) * CONFIG.ENEMY.POTERCHA.SWOOP_SPEED,
              Math.sin(angle) * CONFIG.ENEMY.POTERCHA.SWOOP_SPEED
            );
            this.stateEndTime = time + 520;
          }
        } else if (this.state === 'SWOOP') {
          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            player.takeDamage(CONFIG.ENEMY.POTERCHA.DAMAGE, this.sprite.x);
          }
          if (time >= this.stateEndTime) {
            this.state = 'RETURN';
            this.stateEndTime = time + 650;
          }
        } else if (this.state === 'RETURN') {
          const dy = this.baseY - this.sprite.y;
          this.sprite.body.setVelocityY(Phaser.Math.Clamp(dy * 3.2, -160, 160));
          this.sprite.body.setVelocityX(this.patrolDir * 80);
          if (Math.abs(dy) < 16 || time >= this.stateEndTime) {
            this.state = 'HOVER';
            this.stateEndTime = time + CONFIG.ENEMY.POTERCHA.COOLDOWN_MS;
          }
        }
      }
    }

    /**
     * ============================================================================
     * 9J. BOSS 3: VODYANYK TSAR OF THE DNIPRO RAPIDS ("ВОДЯНИЙ ЦАР ДНІПРОВИХ ПОРОГІВ")
     * Guards the final Dnipro pier where the Giant River Catfish ("Річковий Сом") waits!
     * ============================================================================
     */
    class VodyanykTsarBoss extends Enemy {
      constructor(scene, x, y) {
        super(scene, x, y, 'boss_vodyanyk_tsar', CONFIG.ENEMY.BOSS_VODYANYK_TSAR.MAX_STUN, CONFIG.ENEMY.BOSS_VODYANYK_TSAR.STUN_MS);
        this.stage = 1;
        this.active = false;
        this.state = 'COOLDOWN';
        this.stateEndTime = 0;
        this.moveCycle = 0;
        this.facing = -1;
        this.hitsTakenInWindow = 0;
        this.allowedWindowHits = 2;
        this.lastGuardNoticeTime = 0;
        this.sprite.body.setSize(62, 74);
        this.sprite.body.setOffset(7, 8);
      }

      activate() {
        if (this.active) return;
        this.active = true;
        this.enterCooldownWindow(this.scene.time.now, 900);
        SFX.waterSplash();
      }

      enterCooldownWindow(now, durationMs) {
        this.state = 'COOLDOWN';
        this.isTelegraphing = false;
        this.telegraphLabel.setVisible(false);
        this.sprite.clearTint();
        this.sprite.setAngle(0);
        this.hitsTakenInWindow = 0;
        this.allowedWindowHits = this.stage === 2 ? 1 : 2;
        this.stateEndTime = now + durationMs;
      }

      startCounterAttack(now, fromX) {
        if (this.isStunned || this.isFinished) return;
        this.facing = fromX >= this.sprite.x ? 1 : -1;
        this.sprite.setFlipX(this.facing < 0);
        this.nextMove = (Math.abs(fromX - this.sprite.x) < 165) ? 'TIDAL_SLAM' : 'TRIDENT_SURGE';
        this.state = 'TELEGRAPH';
        this.isTelegraphing = true;
        this.telegraphLabel.setText('🌊!').setColor('#00f5d4').setVisible(true);
        this.sprite.setTint(0x00f5d4);
        this.sprite.setScale(1.22, 0.84);
        this.stateEndTime = now + 340;
        SFX.telegraph();
        if (now - this.lastGuardNoticeTime > 650) {
          this.lastGuardNoticeTime = now;
          this.scene.showFloatingText(this.sprite.x, this.sprite.y - 65, STRINGS.BOSS_COUNTER_WARN, '#48cae4');
        }
      }

      receiveStunHit(stunAmount, fromX, isHeavy = false) {
        if (this.isFinished) return;
        if (!this.active) this.activate();

        if (this.isStunned) {
          this.triggerFinisher(fromX);
          return;
        }

        const now = this.scene.time.now;
        const inOpenWindow = (this.state === 'COOLDOWN') && (this.hitsTakenInWindow < this.allowedWindowHits);

        if (inOpenWindow) {
          this.hitsTakenInWindow++;
          this.stun = Math.min(this.maxStun, this.stun + stunAmount);
          SFX.panHit(isHeavy);
          this.scene.triggerHitStop(CONFIG.FEEL.HIT_STOP_MS);
          this.scene.cameras.main.shake(
            isHeavy ? CONFIG.FEEL.SHAKE_HEAVY_DURATION : CONFIG.FEEL.SHAKE_LIGHT_DURATION,
            isHeavy ? CONFIG.FEEL.SHAKE_HEAVY_INTENSITY : CONFIG.FEEL.SHAKE_LIGHT_INTENSITY
          );
          const dir = this.sprite.x >= fromX ? 1 : -1;
          this.sprite.body.setVelocity(dir * 85, -25);
          this.sprite.setScale(1.22, 0.84);
          this.sprite.setTintFill(0xffffff);
          this.scene.time.delayedCall(80, () => {
            if (this.sprite && this.sprite.active && !this.isTelegraphing) this.sprite.clearTint();
          });
          this.scene.spawnHitParticles(this.sprite.x, this.sprite.y);

          if (this.stun >= this.maxStun) {
            this.enterStunState();
            return;
          }
          if (this.hitsTakenInWindow >= this.allowedWindowHits) {
            this.startCounterAttack(now, fromX);
          }
        } else {
          const reduced = Math.max(4, Math.round(stunAmount * 0.22));
          this.stun = Math.min(this.maxStun, this.stun + reduced);
          SFX.shieldBlock();
          this.scene.spawnWaterSplash(this.sprite.x, this.sprite.y, 5);
          if (this.stun >= this.maxStun) {
            this.enterStunState();
            return;
          }
          if (this.state === 'COOLDOWN') {
            this.startCounterAttack(now, fromX);
          }
        }
      }

      update(time, player) {
        if (!this.active || !this.updateBase(time)) return;

        // Keep boss on the final pier (4160..4760)
        const minPierX = (this.scene.levelData ? this.scene.levelData.bossArenaStartX : 4160) + 45;
        const maxPierX = (this.scene.worldWidth || 4800) - 90;
        if (this.sprite.x < minPierX) this.sprite.x = minPierX;
        if (this.sprite.x > maxPierX) this.sprite.x = maxPierX;

        const onFloor = this.sprite.body.blocked.down || this.sprite.body.touching.down;
        const distToPlayer = Math.abs(player.sprite.x - this.sprite.x);
        const dirToPlayer = player.sprite.x >= this.sprite.x ? 1 : -1;

        if (this.state === 'COOLDOWN') {
          this.facing = dirToPlayer;
          this.sprite.setFlipX(this.facing < 0);
          if (distToPlayer > 140) {
            this.sprite.body.setVelocityX(this.facing * CONFIG.ENEMY.BOSS_VODYANYK_TSAR.STALK_SPEED);
          } else {
            this.sprite.body.setVelocityX(this.sprite.body.velocity.x * 0.8);
          }

          if (time >= this.stateEndTime) {
            const moves = ['TRIDENT_SURGE', 'TIDAL_SLAM', 'WHIRLPOOL_VOLLEY'];
            this.nextMove = moves[this.moveCycle % moves.length];
            this.moveCycle++;
            this.state = 'TELEGRAPH';
            this.isTelegraphing = true;
            this.telegraphLabel.setText('🌊!').setColor('#00f5d4').setVisible(true);
            this.sprite.setTint(0x48cae4);
            this.sprite.setScale(1.2, 0.82);
            const telMs = CONFIG.ENEMY.BOSS_VODYANYK_TSAR.TELEGRAPH_MS * (this.stage === 2 ? 0.82 : 1);
            this.stateEndTime = time + telMs;
            SFX.telegraph();
          }
        } else if (this.state === 'TELEGRAPH') {
          this.sprite.body.setVelocityX(0);
          if (time >= this.stateEndTime) {
            this.isTelegraphing = false;
            this.telegraphLabel.setVisible(false);
            this.sprite.clearTint();
            this.facing = dirToPlayer;
            this.sprite.setFlipX(this.facing < 0);

            if (this.nextMove === 'TRIDENT_SURGE') {
              this.state = 'TRIDENT_SURGE';
              this.sprite.setTint(0x00b4d8);
              this.stateEndTime = time + 560;
              SFX.waterSplash();
            } else if (this.nextMove === 'TIDAL_SLAM') {
              this.state = 'TIDAL_SLAM';
              this.waitingForSlamLand = false;
              const jumpVx = Phaser.Math.Clamp((player.sprite.x - this.sprite.x) * 1.15, -310, 310);
              this.sprite.body.setVelocity(jumpVx, CONFIG.ENEMY.BOSS_VODYANYK_TSAR.JUMP_VEL_Y);
              this.timeOutJump = time + 1450;
              this.scene.time.delayedCall(140, () => { this.waitingForSlamLand = true; });
            } else {
              this.state = 'WHIRLPOOL_VOLLEY';
              this.scene.spawnWaterOrb(this.sprite.x, this.sprite.y - 16, player.sprite.x, player.sprite.y - 12);
              if (this.stage === 2) {
                this.scene.time.delayedCall(220, () => {
                  if (this.sprite && this.sprite.active && !this.isStunned) {
                    this.scene.spawnWaterOrb(this.sprite.x, this.sprite.y - 24, player.sprite.x, player.sprite.y - 24);
                  }
                });
              }
              this.enterCooldownWindow(time, CONFIG.ENEMY.BOSS_VODYANYK_TSAR.COOLDOWN_MS * 0.85);
            }
          }
        } else if (this.state === 'TRIDENT_SURGE') {
          const speed = CONFIG.ENEMY.BOSS_VODYANYK_TSAR.SURGE_SPEED * (this.stage === 2 ? 1.18 : 1);
          this.sprite.body.setVelocityX(this.facing * speed);
          if (Phaser.Geom.Intersects.RectangleToRectangle(this.sprite.getBounds(), player.sprite.getBounds())) {
            player.takeDamage(CONFIG.ENEMY.BOSS_VODYANYK_TSAR.DAMAGE_SURGE, this.sprite.x);
          }
          if (time >= this.stateEndTime || this.sprite.x <= minPierX + 10 || this.sprite.x >= maxPierX - 10) {
            this.enterCooldownWindow(time, CONFIG.ENEMY.BOSS_VODYANYK_TSAR.COOLDOWN_MS * (this.stage === 2 ? 0.75 : 1));
          }
        } else if (this.state === 'TIDAL_SLAM') {
          if ((this.waitingForSlamLand && onFloor) || time > this.timeOutJump) {
            this.sprite.body.setVelocityX(0);
            this.sprite.setScale(1.34, 0.72);
            SFX.waterSplash();
            this.scene.cameras.main.shake(CONFIG.FEEL.SHAKE_HEAVY_DURATION, CONFIG.FEEL.SHAKE_HEAVY_INTENSITY);
            this.scene.spawnTidalWaves(this.sprite.x, CONFIG.GROUND_Y - 14);
            this.enterCooldownWindow(time, CONFIG.ENEMY.BOSS_VODYANYK_TSAR.COOLDOWN_MS * (this.stage === 2 ? 0.74 : 1));
          }
        }
      }

      triggerFinisher(fromX) {
        if (this.stage === 1) {
          this.stage = 2;
          this.isStunned = false;
          this.stun = 0;
          this.barFill.setFillStyle(0xe63946);
          this.stunPrompt.setVisible(false);
          this.stars.forEach(s => s.setVisible(false));

          SFX.finisher();
          SFX.waterSplash();
          this.scene.triggerHitStop(CONFIG.FEEL.FINISHER_HIT_STOP_MS);
          this.scene.cameras.main.shake(260, 0.016);
          this.scene.spawnWaterSplash(this.sprite.x, this.sprite.y, 16);
          this.scene.spawnLoot(this.sprite.x, this.sprite.y);
          this.scene.showFloatingText(this.sprite.x, this.sprite.y - 70, STRINGS.BOSS_VODYANYK_STAGE_2, '#00f5d4');

          this.state = 'TIDAL_SLAM';
          this.waitingForSlamLand = false;
          this.sprite.body.setVelocity(0, -520);
          this.timeOutJump = this.scene.time.now + 1400;
          this.scene.time.delayedCall(140, () => { this.waitingForSlamLand = true; });
        } else {
          super.triggerFinisher(fromX);
          this.scene.time.delayedCall(1100, () => {
            this.scene.triggerVictory();
          });
        }
      }
    }

    /**
     * ============================================================================
     * 10. UI MANAGER (HUD, BOSS BAR, PAUSE MENU, VICTORY SCREEN & TOUCH CONTROLS)
     * All interactive UI elements are created directly in screen space with
     * .setScrollFactor(0) (NOT inside scrolled Containers) to avoid Phaser 3's

     */
    class UI {
      constructor(scene, isHut = false) {
        this.scene = scene;
        this.isHut = isHut;
        this.touchState = { left: false, right: false, down: false, jump: false, roll: false, attack: false, throw: false, heal: false };
        this.isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        this.pauseElements = [];
        this.pauseButtons = [];
        this.selectedPauseIndex = 0;

        this.deathElements = [];
        this.deathButtons = [];
        this.selectedDeathIndex = 0;

        this.victoryElements = [];
        this.controlsModalElements = [];

        if (!isHut) {
          this.createGameHUD();
          this.createControlsModal();
          this.createPauseModal();
          this.createDeathModal();
          this.createVictoryModal();
        }

        this.createTopUtilityButtons();
        this.createTouchControls();
      }

          .setOrigin(0, 0.5).setScrollFactor(0).setDepth(102);

        // Counters: Chervintsi, Galushkas, Kissel (Heal)

          .setStrokeStyle(2, 0xff4d4d).setScrollFactor(0).setDepth(101).setVisible(false);
        this.bossTitle = this.scene.add.text(
          bx,
          by - 11,
          isLevel3 ? STRINGS.BOSS_VODYANYK_NAME : (isLevel2 ? STRINGS.BOSS_LISOVYK_NAME : STRINGS.BOSS_NAME),

      createControlsModal() {
        const cx = CONFIG.WIDTH / 2;
        const cy = CONFIG.HEIGHT / 2;

        // Dimmed backdrop in screen space
        const dim = this.scene.add.rectangle(cx, cy, CONFIG.WIDTH, CONFIG.HEIGHT, 0x0d0e15, 0.8)
          .setScrollFactor(0)
          .setDepth(190)
          .setInteractive();

        // Wider ornate card (700px) so all Ukrainian control descriptions fit cleanly with right margin
        const card = this.scene.add.graphics().setScrollFactor(0).setDepth(191);
        card.fillStyle(0x1d1e2c, 0.98);
        card.fillRoundedRect(cx - 350, cy - 215, 700, 430, 18);
        card.lineStyle(4, 0xffd166, 1);
        card.strokeRoundedRect(cx - 350, cy - 215, 700, 430, 18);
        card.lineStyle(2, 0xc1121f, 0.9);
        card.strokeRoundedRect(cx - 338, cy - 203, 676, 406, 14);

        const headerTxt = this.scene.add.text(cx, cy - 174, STRINGS.CONTROLS_MODAL_HEADER, {
          fontFamily: "'Cormorant Infant', Georgia, serif",
          fontSize: '18px',
          fontStyle: 'bold',
          color: '#ffd166',
          letterSpacing: 2,
          padding: { top: 4, bottom: 4 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(192);

        const titleTxt = this.scene.add.text(cx, cy - 138, STRINGS.CONTROLS_MODAL_TITLE, {
          fontFamily: "'Cormorant Infant', Georgia, serif",
          fontSize: '28px',
          fontStyle: 'bold',
          color: '#ffffff',
          padding: { top: 4, bottom: 6 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(192);

        this.controlsModalElements.push(dim, card, headerTxt, titleTxt);

        // Draw each keycap badge and description row neatly aligned inside the 700px card
        const startY = cy - 92;
        const rowStep = 33;

        STRINGS.CONTROLS_LIST.forEach((item, index) => {
          const rowY = startY + index * rowStep;

          // Keycap badge on the left
          const keyBg = this.scene.add.rectangle(cx - 235, rowY, 136, 26, 0x2b2d42, 1)
            .setStrokeStyle(1.5, 0xffd166)
            .setScrollFactor(0)
            .setDepth(192);

          const keyTxt = this.scene.add.text(cx - 235, rowY, item.key, {
            fontSize: '13px',
            fontStyle: 'bold',
            color: '#ffd166'
          }).setOrigin(0.5).setScrollFactor(0).setDepth(193);

          // Action description on the right (fits well inside cx + 320)
          const descTxt = this.scene.add.text(cx - 150, rowY, item.desc, {
            fontFamily: "'Cormorant Infant', Georgia, serif",
            fontSize: '18px',
            fontStyle: 'bold',
            color: '#f5ebe0',
            padding: { top: 3, bottom: 5 }
          }).setOrigin(0, 0.5).setScrollFactor(0).setDepth(192);

          this.controlsModalElements.push(keyBg, keyTxt, descTxt);
        });

        const footerTxt = this.scene.add.text(cx, cy + 174, STRINGS.CONTROLS_MODAL_FOOTER, {
          fontFamily: "'Cormorant Infant', Georgia, serif",
          fontSize: '20px',
          fontStyle: 'italic bold',
          color: '#f6e4b5',
          padding: { top: 4, bottom: 6 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(192);

        this.controlsModalElements.push(footerTxt);

      createTouchControls() {
        // Show virtual joystick & action buttons only on touch devices, directly in screen space
        if (!this.isTouchDevice) return;

        this.scene.input.addPointer(3);

        // Virtual Joystick on Left
        const joyX = 115, joyY = CONFIG.HEIGHT - 105, joyR = 54;
        this.joyBase = this.scene.add.circle(joyX, joyY, joyR, 0xffffff, 0.18)
          .setStrokeStyle(2, 0xffffff, 0.45)
          .setScrollFactor(0)
          .setDepth(120);
        this.joyThumb = this.scene.add.circle(joyX, joyY, 26, 0xffd166, 0.65)
          .setScrollFactor(0)
          .setDepth(121);

        this.scene.input.on('pointermove', (p) => {
          if (this.scene.isPaused || this.scene.isVictory) return;
          if (p.isDown && p.x < CONFIG.WIDTH * 0.45) {
            const dx = p.x - joyX;
            const dy = p.y - joyY;
            const angle = Math.atan2(dy, dx);
            const dist = Math.min(joyR, Math.hypot(dx, dy));
            this.joyThumb.setPosition(joyX + Math.cos(angle) * dist, joyY + Math.sin(angle) * dist);
            this.touchState.left = dx < -16;
            this.touchState.right = dx > 16;
            this.touchState.down = dy > 22;
          }
        });

        this.scene.input.on('pointerup', (p) => {
          if (p.x < CONFIG.WIDTH * 0.45) {
            this.joyThumb.setPosition(joyX, joyY);
            this.touchState.left = false;
            this.touchState.right = false;
            this.touchState.down = false;
          }
        });

        // Action Buttons on Right (direct screen-space interactive circles)
        const makeTouchBtn = (x, y, r, label, key, color) => {
          const circle = this.scene.add.circle(x, y, r, color, 0.55)
            .setStrokeStyle(2, 0xffffff, 0.8)
            .setScrollFactor(0)
            .setDepth(120)
            .setInteractive();
          const txt = this.scene.add.text(x, y, label, {
            fontSize: '11px',
            fontStyle: 'bold',
            color: '#ffffff'
          }).setOrigin(0.5).setScrollFactor(0).setDepth(121);

          circle.on('pointerdown', () => { this.touchState[key] = true; });
          circle.on('pointerup', () => { this.touchState[key] = false; });
          circle.on('pointerout', () => { this.touchState[key] = false; });
        };

        makeTouchBtn(CONFIG.WIDTH - 75, CONFIG.HEIGHT - 85, 36, STRINGS.TOUCH_JUMP, 'jump', 0x2a9d8f);
        makeTouchBtn(CONFIG.WIDTH - 160, CONFIG.HEIGHT - 75, 36, STRINGS.TOUCH_HIT, 'attack', 0xe63946);
        makeTouchBtn(CONFIG.WIDTH - 140, CONFIG.HEIGHT - 155, 30, STRINGS.TOUCH_ROLL, 'roll', 0x457b9d);
        makeTouchBtn(CONFIG.WIDTH - 65, CONFIG.HEIGHT - 165, 28, STRINGS.TOUCH_GALUSHKA, 'throw', 0xe9c46a);
        makeTouchBtn(CONFIG.WIDTH - 225, CONFIG.HEIGHT - 130, 26, STRINGS.TOUCH_UZVAR, 'heal', 0x9b5de5);
      }
