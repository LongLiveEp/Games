<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>В пошуках солі — Game by LongLiveEP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,700;1,700&family=Marck+Script&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-color: #0e1017;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 0 !important;
      padding: 0 !important;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
      touch-action: none;
    }
    .orientation-prompt {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(14, 16, 23, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .orientation-box {
      background: #1d1e2c;
      border: 2px solid #ffd166;
      border-radius: 16px;
      padding: 26px 20px;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .phone-rotate-icon {
      position: relative;
      margin-bottom: 14px;
      animation: rotatePhoneAnim 2.2s infinite ease-in-out;
    }
    .rotate-arrow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #ffd166;
      font-weight: bold;
    }
    @keyframes rotatePhoneAnim {
      0%, 15% { transform: rotate(0deg); }
      45%, 65% { transform: rotate(-90deg); }
      90%, 100% { transform: rotate(0deg); }
    }
    .orientation-box h2 {
      font-family: 'Cormorant Infant', Georgia, serif;
      font-size: 24px;
      font-weight: bold;
      color: #ffd166;
      margin-bottom: 10px;
    }
    .orientation-box p {
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.45;
      margin-bottom: 18px;
    }
    .orientation-box button {
      background: #2b2d42;
      border: 1px solid #8d99ae;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    .orientation-box button:active {
      background: #3d405b;
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="rotate-device-overlay" class="orientation-prompt">
    <div class="orientation-box">
      <div class="phone-rotate-icon">
        <svg viewBox="0 0 24 24" width="48" height="48" stroke="#ffd166" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
          <line x1="12" y1="18" x2="12" y2="18.01"></line>
        </svg>
        <span class="rotate-arrow">↻</span>
      </div>
      <h2>Поверніть телефон</h2>
      <p>Для зручного керування козаком Омельком переверніть екран у горизонтальний режим (Landscape)</p>
      <button id="dismiss-rotate-prompt" type="button">Продовжити у портретному режимі</button>
    </div>
  </div>

  <script src="js/config.js?v=7"></script>
  <script src="js/state.js?v=7"></script>
  <script src="js/strings.js?v=7"></script>
  <script src="js/levels.js?v=7"></script>
  <script src="js/sound.js?v=7"></script>
  <script src="js/player.js?v=7"></script>
  <script src="js/enemy-base.js?v=7"></script>
  <script src="js/enemies-act1.js?v=7"></script>
  <script src="js/boss-rooster.js?v=7"></script>
  <script src="js/enemies-act2.js?v=7"></script>
  <script src="js/boss-lisovyk.js?v=7"></script>
  <script src="js/enemies-act3.js?v=7"></script>
  <script src="js/boss-vodyanyk.js?v=7"></script>
  <script src="js/enemies-act4.js?v=7"></script>
  <script src="js/boss-zmiy.js?v=7"></script>
  <script src="js/ui.js?v=7"></script>
  <script src="js/scene-boot.js?v=7"></script>
  <script src="js/scene-title.js?v=7"></script>
  <script src="js/scene-hut.js?v=7"></script>
  <script src="js/scene-game.js?v=7"></script>
  <script src="js/scene-hrytsko.js?v=7"></script>
  <script src="js/scene-babayaga.js?v=7"></script>
  <script src="js/scene-catfish.js?v=7"></script>
  <script src="js/scene-finale.js?v=7"></script>
  <script src="js/main.js?v=7"></script>
</body>
</html>
